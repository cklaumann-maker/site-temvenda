    <script>
        const SUPABASE_URL = window.SUPABASE_CONFIG?.url || 'https://mgcoyeohqelystqmytah.supabase.co';
        const SUPABASE_KEY = window.SUPABASE_CONFIG?.anonKey || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1nY295ZW9ocWVseXN0cW15dGFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE2NzAzNjQsImV4cCI6MjA3NzI0NjM2NH0.KBKHH10DaV0m5SroFmXsTedS_dalcAprKnUOI4Unkx4';

        const SLOT_LIMITS = { main: 1, premium: 3, others: 4 };
        const SLOT_LABELS = {
            main: 'Notícia principal',
            premium: 'Notícia premium',
            others: 'Demais notícias'
        };

        let slotStatus = {
            main: { count: 0, limit: SLOT_LIMITS.main },
            premium: { count: 0, limit: SLOT_LIMITS.premium },
            others: { count: 0, limit: SLOT_LIMITS.others }
        };

        let currentFilters = {
            status: '',
            category: '',
            priority: '',
            search: ''
        };

        let currentArticle = null;

        function getSlotKey(priority) {
            if (priority === 2) return 'main';
            if (priority === 1) return 'premium';
            return 'others';
        }

        function formatSlotLabel(slotKey) {
            return SLOT_LABELS[slotKey] || SLOT_LABELS.others;
        }

        function updateSlotBadges() {
            const mapping = [
                { id: 'slot-main', key: 'main', label: 'Principal' },
                { id: 'slot-premium', key: 'premium', label: 'Premium' },
                { id: 'slot-others', key: 'others', label: 'Demais' }
            ];
            mapping.forEach(({ id, key, label }) => {
                const el = document.getElementById(id);
                if (!el) return;
                const info = slotStatus[key] || { count: 0, limit: SLOT_LIMITS[key] };
                el.textContent = `${label}: ${info.count}/${info.limit}`;
                if (info.count >= info.limit) {
                    el.classList.add('full');
                } else {
                    el.classList.remove('full');
                }
            });
        }

        function sanitize(text) {
            if (!text) return '';
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function truncate(text, limit = 180) {
            const clean = sanitize(text);
            return clean.length > limit ? `${clean.slice(0, limit)}…` : clean;
        }

        async function fetchJson(url, options = {}) {
            const response = await fetch(url, {
                ...options,
                    headers: {
                        'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    ...(options.headers || {})
                    }
                });
            if (!response.ok) {
                throw new Error(`Erro na requisição: ${response.status}`);
            }
            return response.json();
        }
                
        async function loadStats() {
            try {
                const articles = await fetchJson(`${SUPABASE_URL}/rest/v1/news_articles?select=status,is_published,priority`);
                const stats = {
                    total: articles.length,
                    pending: articles.filter(a => a.status === 'pending').length,
                    approved: articles.filter(a => a.status === 'approved').length,
                    rejected: articles.filter(a => a.status === 'rejected').length
                };
                
                document.getElementById('total-articles').textContent = stats.total;
                document.getElementById('pending-articles').textContent = stats.pending;
                document.getElementById('approved-articles').textContent = stats.approved;
                document.getElementById('rejected-articles').textContent = stats.rejected;
                
                const published = articles.filter(article => article.is_published);
                const slotCounts = { main: 0, premium: 0, others: 0 };
                published.forEach(article => {
                    const key = getSlotKey(article.priority);
                    slotCounts[key] += 1;
                });

                slotStatus = {
                    main: { count: slotCounts.main, limit: SLOT_LIMITS.main },
                    premium: { count: slotCounts.premium, limit: SLOT_LIMITS.premium },
                    others: { count: slotCounts.others, limit: SLOT_LIMITS.others }
                };
                updateSlotBadges();

                const totalPublished = slotCounts.main + slotCounts.premium + slotCounts.others;
                const siteNewsCounter = document.getElementById('site-news-counter');
                const siteNewsCountEl = document.getElementById('site-news-count');
                
                if (siteNewsCountEl) {
                    siteNewsCountEl.textContent = totalPublished;
                }
                
                if (siteNewsCounter) {
                    if (totalPublished >= 8) {
                        siteNewsCounter.classList.add('limit-reached');
                    } else {
                        siteNewsCounter.classList.remove('limit-reached');
                    }
                }
            } catch (error) {
                console.error('Erro ao carregar estatísticas:', error);
            }
        }

        async function loadCategories() {
            try {
                const categories = await fetchJson(`${SUPABASE_URL}/rest/v1/news_categories?select=id,name&is_active=eq.true&order=name`);
                const select = document.getElementById('category-filter');
                if (!select) return;
                select.innerHTML = '<option value="">Todas</option>';
                categories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category.id;
                    option.textContent = category.name;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Erro ao carregar categorias:', error);
            }
        }

        async function loadArticles() {
            const container = document.getElementById('articles-container');
            if (!container) return;
            container.innerHTML = '<div class="loading"><p>🔄 Carregando artigos...</p></div>';
            
            try {
                let url = `${SUPABASE_URL}/rest/v1/news_articles?select=*,news_categories(name),news_sources(name)&order=created_at.desc`;
                
                if (currentFilters.status) {
                    url += `&status=eq.${currentFilters.status}`;
                }
                if (currentFilters.category) {
                    url += `&category_id=eq.${currentFilters.category}`;
                }
                if (currentFilters.priority) {
                    url += `&priority=eq.${currentFilters.priority}`;
                }
                if (currentFilters.search) {
                    const term = encodeURIComponent(currentFilters.search);
                    url += `&or=(title.ilike.*${term}*,excerpt.ilike.*${term}*)`;
                }

                const articles = await fetchJson(url);

                if (!articles.length) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h3>📰 Nenhum artigo encontrado</h3>
                            <p>Ajuste os filtros ou aguarde novas coletas automáticas.</p>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = `
                    <div class="articles-grid">
                        ${articles.map(createArticleCard).join('')}
                    </div>
                `;
            } catch (error) {
                console.error('Erro ao carregar artigos:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>❌ Erro ao carregar artigos</h3>
                        <p>Verifique a conexão e tente novamente.</p>
                    </div>
                `;
            }
        }

        function createArticleCard(article) {
            const statusClass = `status-${article.status}`;
            const statusIcon = article.status === 'pending' ? '⏳' : article.status === 'approved' ? '✅' : '❌';
            const statusText = article.status === 'pending' ? 'Aguardando' : article.status === 'approved' ? 'Aprovado' : 'Rejeitado';

            const categoryName = article.news_categories?.name || 'Sem categoria';
            const sourceName = article.news_sources?.name || 'Fonte desconhecida';
            const publishedDate = article.published_at ? new Date(article.published_at).toLocaleDateString('pt-BR') : 'Data não disponível';

            const slotKey = getSlotKey(article.priority);
            const slotInfo = slotStatus[slotKey] || { count: 0, limit: SLOT_LIMITS[slotKey] };
            const slotLabel = formatSlotLabel(slotKey);
            const slotFull = slotInfo.count >= slotInfo.limit && !article.is_published;
            const slotInfoClass = slotFull ? 'article-slot-info full' : 'article-slot-info';

            const summary = truncate(article.executive_summary || article.excerpt || '', 220);
            const canApproveOnly = article.status === 'pending';
            const canReject = article.status !== 'rejected';
            const canRestore = article.status === 'rejected';
            const quickActions = [
                canApproveOnly ? `<button class="btn-outline" onclick="approveOnlyArticle(${article.id})">Aprovar</button>` : '',
                canReject ? `<button class="btn-outline danger" onclick="rejectArticle(${article.id})">Rejeitar</button>` : '',
                canRestore ? `<button class="btn-outline" onclick="restoreArticle(${article.id})">Restaurar</button>` : ''
            ].filter(Boolean).join('');
            
            return `
                <div class="article-card">
                    <div class="article-content">
                        <div class="article-status">
                            <span class="status-badge ${statusClass}">
                                ${statusIcon} ${statusText}
                            </span>
                            ${article.is_published ? `<span class="publish-badge">🌐 Publicada no site</span>` : ''}
                    </div>
                        <div class="article-info">
                            <div class="article-title" title="${sanitize(article.title)}">${sanitize(article.title)}</div>
                            <div class="article-meta">
                                <span class="meta-item">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                        <circle cx="12" cy="7" r="4"/>
                                </svg>
                                    ${sanitize(sourceName)}
                                </span>
                                <span class="meta-item">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                                        <line x1="16" y1="2" x2="16" y2="6"/>
                                        <line x1="8" y1="2" x2="8" y2="6"/>
                                        <line x1="3" y1="10" x2="21" y2="10"/>
                                </svg>
                                    ${sanitize(publishedDate)}
                                </span>
                                <span class="meta-item">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                                    </svg>
                                    ${sanitize(categoryName)}
                                </span>
                            </div>
                            <div class="${slotInfoClass}">
                                Alocação prevista: ${slotLabel}
                                <span>(${slotInfo.count}/${slotInfo.limit})</span>
                                ${slotFull ? ' • Slot completo' : ''}
                            </div>
                            ${summary ? `<p style="margin-top: 12px; font-size: 13px; color: var(--tv-gray-medium); line-height: 1.6;">${summary}</p>` : ''}
                        </div>
                    </div>
                    <div class="article-actions">
                        ${quickActions ? `<div class="article-quick-actions">${quickActions}</div>` : ''}
                        ${(article.status === 'pending' || (article.status === 'approved' && !article.is_published)) ? `
                            <button class="btn-action" onclick="approveArticle(${article.id}, ${article.priority ?? 0})">
                                ${article.status === 'pending' ? 'Liberar' : 'Publicar'} ${slotLabel}
                            </button>
                        ` : ''}
                        ${article.is_published ? `
                            <button class="btn-action danger" onclick="unpublishArticle(${article.id})">
                                Remover do site
                            </button>
                        ` : ''}
                        <button class="btn-icon" onclick="viewArticle(${article.id})" title="Ver detalhes">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                        ${article.url ? `
                            <a href="${article.url}" target="_blank" class="btn-icon" title="Ver original">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
                                <polyline points="15,3 21,3 21,9"/>
                                <line x1="10" y1="14" x2="21" y2="3"/>
                            </svg>
                        </a>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        async function fetchPublishedArticles() {
            try {
                return await fetchJson(`${SUPABASE_URL}/rest/v1/news_articles?select=id,priority,updated_at&is_published=eq.true`);
            } catch (error) {
                console.error('Erro ao buscar notícias publicadas:', error);
                return [];
            }
        }

        async function approveArticle(articleId, priority = 0) {
            try {
                const publishedArticles = await fetchPublishedArticles();
                const slotCounts = { main: 0, premium: 0, others: 0 };
                publishedArticles.forEach(article => {
                    const key = getSlotKey(article.priority);
                    slotCounts[key] += 1;
                });
                const slotKey = getSlotKey(priority);
                if (slotCounts[slotKey] >= SLOT_LIMITS[slotKey]) {
                    alert(`O slot "${formatSlotLabel(slotKey)}" está completo (${slotCounts[slotKey]}/${SLOT_LIMITS[slotKey]}). Remova uma notícia antes de liberar outra.`);
                        return;
                    }
                const response = await fetch(`${SUPABASE_URL}/rest/v1/news_articles?id=eq.${articleId}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        status: 'approved',
                        is_published: true,
                        updated_at: new Date().toISOString()
                    })
                });
                if (!response.ok) {
                    throw new Error('Erro ao aprovar artigo');
                }
                await loadStats();
                await loadArticles();
            } catch (error) {
                console.error('Erro ao aprovar artigo:', error);
                alert('❌ Não foi possível liberar a notícia.');
            }
        }

        async function approveOnlyArticle(articleId) {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/news_articles?id=eq.${articleId}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        status: 'approved',
                        is_published: false,
                        updated_at: new Date().toISOString()
                    })
                });
                if (!response.ok) {
                    throw new Error('Erro ao aprovar artigo');
                }
                await loadStats();
                await loadArticles();
            } catch (error) {
                console.error('Erro ao aprovar artigo:', error);
                alert('❌ Não foi possível aprovar a notícia.');
            }
        }

        async function unpublishArticle(articleId) {
            if (!confirm('Remover esta notícia do site?')) {
                return;
            }
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/news_articles?id=eq.${articleId}`, {
                                    method: 'PATCH',
                                    headers: {
                                        'apikey': SUPABASE_KEY,
                                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify({
                        is_published: false,
                                        updated_at: new Date().toISOString()
                                    })
                                });
                if (!response.ok) {
                    throw new Error('Erro ao remover notícia do site');
                }
                await loadStats();
                await loadArticles();
            } catch (error) {
                console.error('Erro ao remover notícia:', error);
                alert('❌ Não foi possível remover a notícia do site.');
            }
        }

        async function rejectArticle(articleId) {
            if (!confirm('Tem certeza que deseja rejeitar esta notícia? Ela sairá do site, se publicada.')) {
                return;
            }
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/news_articles?id=eq.${articleId}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        status: 'rejected',
                        is_published: false,
                        updated_at: new Date().toISOString()
                    })
                });
                if (!response.ok) {
                    throw new Error('Erro ao rejeitar artigo');
                }
                await loadStats();
                await loadArticles();
            } catch (error) {
                console.error('Erro ao rejeitar artigo:', error);
                alert('❌ Não foi possível rejeitar a notícia.');
            }
        }

        async function restoreArticle(articleId) {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/news_articles?id=eq.${articleId}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        status: 'pending',
                        is_published: false,
                        updated_at: new Date().toISOString()
                    })
                });
                if (!response.ok) {
                    throw new Error('Erro ao restaurar artigo');
                }
                await loadStats();
                await loadArticles();
            } catch (error) {
                console.error('Erro ao restaurar artigo:', error);
                alert('❌ Não foi possível restaurar a notícia.');
            }
        }

        async function viewArticle(articleId) {
            try {
                const articles = await fetchJson(`${SUPABASE_URL}/rest/v1/news_articles?select=*,news_categories(name),news_sources(name)&id=eq.${articleId}&limit=1`);
                if (!articles.length) return;

                const article = articles[0];
                currentArticle = article;

                const categoryName = article.news_categories?.name || 'Sem categoria';
                const sourceName = article.news_sources?.name || 'Fonte desconhecida';
                const publishedDate = article.published_at ? new Date(article.published_at).toLocaleDateString('pt-BR', {
                    day: '2-digit',
                    month: 'long',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                }) : 'Data não disponível';

                const scrapedDate = article.scraped_at ? new Date(article.scraped_at).toLocaleDateString('pt-BR', {
                    day: '2-digit',
                    month: 'long',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                }) : 'Data não disponível';

                document.getElementById('modal-title').textContent = article.title;
                document.getElementById('modal-body').innerHTML = `
                    <p><strong>Fonte:</strong> ${sanitize(sourceName)}</p>
                    <p><strong>Categoria:</strong> ${sanitize(categoryName)}</p>
                    <p><strong>Status:</strong> <span class="status-badge status-${article.status}">${article.status === 'pending' ? '⏳ Aguardando' : article.status === 'approved' ? '✅ Aprovado' : '❌ Rejeitado'}</span></p>
                    <p><strong>Publicada no site:</strong> ${article.is_published ? 'Sim' : 'Não'}</p>
                    <p><strong>Data de Publicação:</strong> ${sanitize(publishedDate)}</p>
                    <p><strong>Data de Coleta:</strong> ${sanitize(scrapedDate)}</p>
                    ${article.url ? `<p><strong>URL Original:</strong> <a href="${article.url}" target="_blank" rel="noopener">${sanitize(article.url)}</a></p>` : ''}
                    <hr style="margin: 24px 0; border: none; border-top: 1px solid var(--tv-gray-border);">
                    <div style="margin-top: 24px;">
                        <strong>Conteúdo:</strong>
                        <div style="margin-top: 12px; padding: 16px; background: var(--tv-gray-light); border-radius: 8px; line-height: 1.8;">
                            ${article.content || article.excerpt || 'Conteúdo não disponível'}
                        </div>
                    </div>
                `;

                document.getElementById('article-modal').classList.add('active');
            } catch (error) {
                console.error('Erro ao carregar detalhes do artigo:', error);
                alert('Erro ao carregar detalhes do artigo.');
            }
        }

        function closeModal() {
            document.getElementById('article-modal').classList.remove('active');
        }

        document.getElementById('article-modal').addEventListener('click', (event) => {
            if (event.target.id === 'article-modal') {
                closeModal();
            }
        });

        document.getElementById('status-filter').addEventListener('change', (event) => {
            currentFilters.status = event.target.value;
            loadArticles();
        });

        document.getElementById('category-filter').addEventListener('change', (event) => {
            currentFilters.category = event.target.value;
            loadArticles();
        });

        document.getElementById('priority-filter').addEventListener('change', (event) => {
            currentFilters.priority = event.target.value;
            loadArticles();
        });

        document.getElementById('search-input').addEventListener('input', (event) => {
            currentFilters.search = event.target.value;
        });

        document.getElementById('search-input').addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
            loadArticles();
            }
        });

        const filterButton = document.querySelector('.filters-card .btn');
        if (filterButton) {
            filterButton.addEventListener('click', () => {
                loadArticles();
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await loadStats();
            await loadCategories();
            await loadArticles();
        });
    </script>
</body>
</html>
