<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada - TEM VENDA</title>
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/favicon-32.png" sizes="180x180">
    <!-- Google Analytics 4 -->
    <script src="/ga4-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --tv-white: #ffffff;
            --tv-black: #000000;
            --tv-gray-dark: #2D2D2D;
            --tv-gray-medium: #666666;
            --tv-gray-light: #999999;
            --tv-gray-very-light: #F5F5F5;
            --tv-gray-border: #E5E5E5;
            --tv-green: #5ee100;
            --tv-green-hover: #4bc800;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, var(--tv-white) 0%, var(--tv-gray-very-light) 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-container {
            text-align: center;
            max-width: 600px;
            padding: 60px 40px;
            background: var(--tv-white);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        }

        .error-code {
            font-size: 120px;
            font-weight: 900;
            color: var(--tv-green);
            line-height: 1;
            margin-bottom: 20px;
        }

        .error-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--tv-black);
            margin-bottom: 16px;
        }

        .error-message {
            font-size: 18px;
            color: var(--tv-gray-medium);
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .error-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .btn-primary {
            background: var(--tv-green);
            color: var(--tv-black);
        }

        .btn-primary:hover {
            background: var(--tv-green-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(94, 225, 0, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: var(--tv-gray-medium);
            border: 2px solid var(--tv-gray-border);
        }

        .btn-secondary:hover {
            border-color: var(--tv-green);
            color: var(--tv-green);
        }

        .logo {
            margin-bottom: 40px;
        }

        .logo img {
            height: 50px;
            width: auto;
        }

        @media (max-width: 480px) {
            .error-code {
                font-size: 80px;
            }

            .error-title {
                font-size: 24px;
            }

            .error-message {
                font-size: 16px;
            }

            .error-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="logo">
            <img src="/logo-temvenda.png" alt="TEM VENDA" onerror="this.style.display='none'">
        </div>
        <div class="error-code">404</div>
        <h1 class="error-title">Página não encontrada</h1>
        <p class="error-message">
            Desculpe, a página que você está procurando não existe ou foi movida.
        </p>
        <div class="error-actions">
            <a href="/" class="btn btn-primary">Voltar à página inicial</a>
            <a href="javascript:history.back()" class="btn btn-secondary">Voltar</a>
        </div>
    </div>
</body>
</html>
