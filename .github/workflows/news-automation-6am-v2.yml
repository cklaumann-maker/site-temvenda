name: 🤖 Coleta Diária de Notícias (6h da manhã)
# Versão atualizada: 2025-11-19 - Inclui instalação obrigatória do Supabase

on:
  # Executar todos os dias às 6h da manhã (horário de Brasília = 9h UTC)
  schedule:
    - cron: '0 9 * * *'  # Todos os dias às 09:00 UTC (06:00 BRT)
  
  # Permitir execução manual
  workflow_dispatch:

jobs:
  collect-news-6am:
    name: 📰 Coletar Notícias (6h da manhã)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 Checkout código (FORÇAR ÚLTIMA VERSÃO)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false
          clean: true
      
      - name: 🔄 FORÇAR ATUALIZAÇÃO PARA ÚLTIMO COMMIT (SEMPRE)
        run: |
          echo "🔄 FORÇANDO atualização para o último commit do main..."
          echo "📋 Commit ANTES da atualização:"
          git log -1 --oneline || echo "Nenhum commit encontrado"
          echo ""
          echo "📥 Fazendo fetch do origin/main..."
          git fetch origin main --force
          echo ""
          echo "🔄 Resetando para origin/main..."
          git reset --hard origin/main
          echo ""
          echo "📋 Commit DEPOIS da atualização:"
          COMMIT_HASH=$(git log -1 --format="%H")
          COMMIT_MSG=$(git log -1 --format="%s")
          COMMIT_DATE=$(git log -1 --format="%ad")
          echo "Hash: $COMMIT_HASH"
          echo "Mensagem: $COMMIT_MSG"
          echo "Data: $COMMIT_DATE"
          echo ""
          # Verificar se ainda é o commit antigo (não deveria ser)
          if [ "$COMMIT_HASH" = "cc9161c90eb83a5bb6143065821cdc1a9839bbe7" ]; then
            echo "❌ ERRO CRÍTICO: Ainda no commit antigo após atualização!"
            echo "📥 Tentando novamente com mais força..."
            git fetch origin main --force --prune
            git reset --hard origin/main
            git clean -fd
            COMMIT_HASH=$(git log -1 --format="%H")
            echo "✅ Novo hash: $COMMIT_HASH"
          fi
          echo ""
          echo "📁 Verificando se news_collector.py existe:"
          if [ -f news_collector.py ]; then
            echo "✅ Arquivo existe"
            echo "📋 Primeiras 25 linhas (verificando código correto):"
            head -25 news_collector.py
            echo ""
            # Verificar se tem a instalação automática
            if grep -q "Instalando automaticamente" news_collector.py; then
              echo "✅ Código correto: tem instalação automática do Supabase"
            else
              echo "⚠️ Código pode estar desatualizado"
            fi
          else
            echo "❌ Arquivo NÃO existe!"
            exit 1
          fi
      
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 🧹 Limpar cache do pip
        run: |
          python3 -m pip cache purge || true
          echo "✅ Cache limpo"
      
      - name: 🔧 Atualizar pip, setuptools e wheel
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          echo "✅ Ferramentas atualizadas"
          python3 --version
          python3 -m pip --version
      
      - name: 📦 Instalar dependências do requirements.txt
        run: |
          echo "📦 Instalando todas as dependências do requirements.txt..."
          python3 -m pip install --no-cache-dir -r requirements.txt
          echo ""
          echo "🧪 Testando importações essenciais..."
          python3 -c "import requests, feedparser, bs4, openai; print('✅ Dependências OK')" || {
            echo "❌ ERRO: Dependências não instaladas!"
            exit 1
          }
          echo "✅ Dependências instaladas com sucesso!"
          echo "✅ Tudo pronto para executar o script!"
      
      - name: 🔐 Verificar variáveis de ambiente
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "✅ Verificando configuração..."
          echo "SUPABASE_URL: $([ -n '$SUPABASE_URL' ] && echo '✅ Configurado' || echo '❌ Não configurado')"
          echo "OPENAI_API_KEY: $([ -n '$OPENAI_API_KEY' ] && echo '✅ Configurado' || echo '❌ Não configurado')"
          echo "SUPABASE_KEY: $([ -n '$SUPABASE_KEY' ] && echo '✅ Configurado' || echo '❌ Não configurado')"
      
      - name: 🚀 Executar coletor de notícias
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "🚀 Iniciando coleta automática de notícias..."
          echo "📅 Data: $(date)"
          echo "⏰ Horário (UTC): $(date +%H:%M)"
          echo "Python: $(python3 --version)"
          echo ""
          python3 news_collector.py
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Coleta concluída com sucesso!"
          else
            echo "❌ Erro na execução (código: $EXIT_CODE)"
            exit $EXIT_CODE
          fi
      
      - name: 📊 Upload logs (se houver erro)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: news-collector-logs-6am
          path: |
            news_collector.log
            logs/*.log
          retention-days: 7
      
      - name: ✅ Notificar sucesso
        if: success()
        run: |
          echo "✅ Coleta de notícias executada com sucesso às 6h da manhã!"
          echo "📊 Verifique o painel admin para aprovar notícias"
          echo "🕐 Próxima execução automática: Amanhã às 6h (9h UTC)"
      
      - name: ⚠️ Notificar falha
        if: failure()
        run: |
          echo "❌ Erro na coleta de notícias!"
          echo "📋 Verifique os logs para mais detalhes"
          echo "🔄 O workflow tentará novamente automaticamente amanhã às 6h"
          echo "💡 Se o erro persistir, verifique:"
          echo "   - Secrets do GitHub (SUPABASE_URL, SUPABASE_KEY, OPENAI_API_KEY)"
          echo "   - Status do Supabase"
          echo "   - Logs completos acima"



