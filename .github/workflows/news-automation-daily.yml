name: 🤖 Coleta Diária de Notícias (a cada 6h)

on:
  # Executar a cada 6 horas
  schedule:
    - cron: '0 */6 * * *'  # A cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
  
  # Permitir execução manual
  workflow_dispatch:

jobs:
  collect-news-daily:
    name: 📰 Coletar Notícias (Diário)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
      
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 🚀 Executar coletor de notícias
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "🚀 Iniciando coleta automática de notícias..."
          echo "📅 Data: $(date)"
          echo ""
          
          python3 news_collector.py
          
          echo ""
          echo "✅ Coleta concluída!"
      
      - name: 📊 Upload logs (se houver erro)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: news-collector-logs-daily
          path: |
            news_collector.log
            logs/*.log
          retention-days: 7


