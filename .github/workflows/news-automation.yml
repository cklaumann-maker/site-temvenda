name: 🤖 Coleta Automática de Notícias

on:
  # Executar nas quartas e sábados às 8h (horário de Brasília = 11h UTC)
  schedule:
    - cron: '0 11 * * 3,6'  # Quartas e sábados às 11:00 UTC (8:00 BRT)
  
  # Permitir execução manual
  workflow_dispatch:
  
  # Executar em push para testar (opcional - pode remover)
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'news_collector.py'
  #     - '.github/workflows/news-automation.yml'

jobs:
  collect-news:
    name: 📰 Coletar Notícias
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
      
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 🔐 Configurar variáveis de ambiente
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "✅ Variáveis de ambiente configuradas"
          echo "SUPABASE_URL está configurado: $([ -n '$SUPABASE_URL' ] && echo 'sim' || echo 'não')"
          echo "OPENAI_API_KEY está configurado: $([ -n '$OPENAI_API_KEY' ] && echo 'sim' || echo 'não')"
      
      - name: 🚀 Executar coletor de notícias
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "🚀 Iniciando coleta de notícias..."
          echo "📅 Data: $(date)"
          echo "🌍 Timezone: $(date +%Z)"
          echo ""
          
          python3 news_collector.py
          
          echo ""
          echo "✅ Coleta concluída!"
      
      - name: 📊 Upload logs (se houver erro)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: news-collector-logs
          path: |
            news_collector.log
            logs/*.log
          retention-days: 7
      
      - name: 📧 Notificar sucesso (opcional)
        if: success()
        run: |
          echo "✅ Coleta de notícias executada com sucesso!"
          echo "📊 Verifique o painel admin para aprovar notícias"
      
      - name: ⚠️ Notificar falha (opcional)
        if: failure()
        run: |
          echo "❌ Erro na coleta de notícias!"
          echo "📋 Verifique os logs para mais detalhes"


