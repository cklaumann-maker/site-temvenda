name: 🤖 Coleta Diária de Notícias (6h da manhã)

on:
  schedule:
    - cron: '0 9 * * *'  # 09:00 UTC = 06:00 BRT
  workflow_dispatch:

jobs:
  collect-news-6am:
    name: 📰 Coletar Notícias (6h da manhã)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - name: 🔄 Forçar última versão
        run: |
          git fetch origin main --force
          git reset --hard origin/main
          echo "✅ Commit: $(git log -1 --format='%h %s')"

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependências
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --no-cache-dir -r requirements.txt
          python3 -c "import requests, feedparser, bs4, openai; print('✅ Dependências OK')"

      - name: 🚀 Executar coletor de notícias
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "🚀 Iniciando coleta - $(date)"
          python3 news_collector.py
          echo "✅ Coleta concluída!"

      - name: 📊 Upload logs (se houver erro)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: news-collector-logs-6am
          path: |
            news_collector.log
            logs/*.log
          retention-days: 7
