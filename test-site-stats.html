<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste - Site Stats</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="/supabase-config.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-result {
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔍 Teste de Conexão - Site Stats</h1>
    <div id="results"></div>

    <script>
        const resultsDiv = document.getElementById('results');

        function addResult(type, title, content) {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = `<strong>${title}</strong><br>${content}`;
            resultsDiv.appendChild(div);
        }

        async function testConnection() {
            // Teste 1: Verificar configuração
            addResult('info', '1. Verificando Configuração...', '');
            
            if (!window.SUPABASE_CONFIG) {
                addResult('error', '❌ Erro', 'window.SUPABASE_CONFIG não encontrado!');
                return;
            }

            addResult('success', '✅ Configuração encontrada', `
                URL: ${window.SUPABASE_CONFIG.url}<br>
                Anon Key: ${window.SUPABASE_CONFIG.anonKey ? 'Configurado' : 'Não configurado'}
            `);

            // Teste 2: Conectar ao Supabase
            addResult('info', '2. Conectando ao Supabase...', '');
            
            try {
                const { createClient } = supabase;
                const client = createClient(
                    window.SUPABASE_CONFIG.url, 
                    window.SUPABASE_CONFIG.anonKey
                );

                // Teste 3: Buscar dados da tabela site_stats
                addResult('info', '3. Buscando dados da tabela site_stats...', '');
                
                const { data, error } = await client
                    .from('site_stats')
                    .select('key, value');

                if (error) {
                    addResult('error', '❌ Erro ao buscar dados', `
                        <pre>${JSON.stringify(error, null, 2)}</pre>
                    `);
                    return;
                }

                if (!data || data.length === 0) {
                    addResult('error', '⚠️ Aviso', 'Tabela site_stats está vazia ou não retornou dados.');
                    return;
                }

                addResult('success', `✅ Dados encontrados (${data.length} registros)`, `
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `);

                // Teste 4: Verificar chaves esperadas
                addResult('info', '4. Verificando chaves esperadas...', '');
                
                const expectedKeys = [
                    'anos-experiencia',
                    'faturamento-anual',
                    'pessoas-geridas',
                    'inicio-mercado',
                    'gestores-treinados',
                    'nps-clientes',
                    'redes-parceiras'
                ];

                const stats = {};
                data.forEach(row => {
                    stats[row.key] = row.value;
                });

                const missingKeys = expectedKeys.filter(key => !stats[key]);
                const foundKeys = expectedKeys.filter(key => stats[key]);

                if (foundKeys.length > 0) {
                    addResult('success', `✅ Chaves encontradas (${foundKeys.length})`, `
                        <ul>
                            ${foundKeys.map(key => `<li><strong>${key}:</strong> ${stats[key]}</li>`).join('')}
                        </ul>
                    `);
                }

                if (missingKeys.length > 0) {
                    addResult('error', `⚠️ Chaves faltando (${missingKeys.length})`, `
                        <ul>
                            ${missingKeys.map(key => `<li>${key}</li>`).join('')}
                        </ul>
                    `);
                }

                // Teste 5: Testar escrita (opcional)
                addResult('info', '5. Teste de escrita (opcional)...', '');
                addResult('info', 'ℹ️ Nota', 'Para testar escrita, use a página admin-stats.html');

            } catch (error) {
                addResult('error', '❌ Erro na conexão', `
                    <pre>${error.message}</pre>
                    <pre>${error.stack}</pre>
                `);
            }
        }

        // Executar teste quando a página carregar
        document.addEventListener('DOMContentLoaded', testConnection);
    </script>
</body>
</html>
