<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | TEM VENDA</title>
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/favicon-32.png" sizes="180x180">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="/ga4-config.js"></script>
    <style>
        :root {
            --tv-white: #FFFFFF;
            --tv-black: #000000;
            --tv-gray-light: #F8F9FA;
            --tv-gray-medium: #666666;
            --tv-gray-dark: #2D2D2D;
            --tv-gray-border: #E5E5E5;
            --tv-green: #5ee100;
            --tv-green-hover: #4bc800;
            --tv-success: #51cf66;
            --tv-warning: #ff8c00;
            --tv-danger: #ff4444;
            --sidebar-width: 240px;
            --sidebar-collapsed: 56px;
            --header-height: 56px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--tv-gray-light);
            color: var(--tv-black);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
            height: 100vh;
        }

        /* ===== APP LAYOUT ===== */
        .app { display: flex; height: 100vh; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--tv-gray-dark);
            color: var(--tv-white);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: width .2s ease;
            z-index: 100;
        }

        .sidebar-logo {
            padding: 20px 16px;
            border-bottom: 1px solid rgba(255,255,255,.08);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-logo .logo-text {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: -.3px;
            white-space: nowrap;
        }

        .sidebar-logo .logo-dot {
            width: 8px; height: 8px;
            background: var(--tv-green);
            border-radius: 50%;
            flex-shrink: 0;
        }

        .sidebar-nav {
            flex: 1;
            padding: 12px 8px;
            overflow-y: auto;
        }

        .sidebar-nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            color: rgba(255,255,255,.6);
            cursor: pointer;
            transition: all .15s;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            margin-bottom: 2px;
            white-space: nowrap;
        }

        .sidebar-nav-item:hover {
            background: rgba(255,255,255,.06);
            color: rgba(255,255,255,.9);
        }

        .sidebar-nav-item.active {
            background: rgba(94,225,0,.12);
            color: var(--tv-green);
        }

        .sidebar-nav-item .nav-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 16px;
        }

        .sidebar-nav-item .nav-badge {
            margin-left: auto;
            background: var(--tv-green);
            color: var(--tv-black);
            font-size: 10px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 999px;
            min-width: 18px;
            text-align: center;
        }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid rgba(255,255,255,.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-user {
            font-size: 12px;
            color: rgba(255,255,255,.5);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sidebar-logout {
            background: none;
            border: 1px solid rgba(255,255,255,.15);
            color: rgba(255,255,255,.5);
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all .15s;
        }

        .sidebar-logout:hover {
            border-color: var(--tv-danger);
            color: var(--tv-danger);
        }

        /* ===== MAIN CONTENT ===== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        .content-header {
            background: var(--tv-white);
            border-bottom: 1px solid var(--tv-gray-border);
            padding: 16px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .content-header h2 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -.3px;
        }

        .content-header .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .content-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
        }

        /* ===== SHARED COMPONENTS ===== */
        .card {
            background: var(--tv-white);
            border: 1px solid var(--tv-gray-border);
            border-radius: 10px;
            box-shadow: 0 1px 3px rgba(0,0,0,.04);
        }

        .card-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--tv-gray-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-title { font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .4px; color: var(--tv-gray-dark); }

        .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-chip {
            background: var(--tv-white);
            border: 1px solid var(--tv-gray-border);
            border-radius: 6px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-chip .num { font-size: 16px; font-weight: 700; }
        .stat-chip .lbl { font-size: 12px; color: var(--tv-gray-medium); }

        .btn {
            border: 1px solid var(--tv-gray-border);
            background: var(--tv-white);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all .15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover { border-color: var(--tv-black); }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .btn-primary { background: var(--tv-green); border-color: var(--tv-green); color: var(--tv-black); font-weight: 700; }
        .btn-primary:hover { background: var(--tv-green-hover); border-color: var(--tv-green-hover); }
        .btn-danger { border-color: rgba(255,68,68,.4); color: var(--tv-danger); }
        .btn-danger:hover { border-color: var(--tv-danger); background: rgba(255,68,68,.06); }
        .btn-success { border-color: rgba(81,207,102,.4); color: var(--tv-success); }
        .btn-success:hover { border-color: var(--tv-success); background: rgba(81,207,102,.06); }
        .btn-warning { border-color: rgba(255,140,0,.4); color: var(--tv-warning); }
        .btn-warning:hover { border-color: var(--tv-warning); background: rgba(255,140,0,.06); }

        .input, .select-field {
            border: 1px solid var(--tv-gray-border);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 13px;
            font-family: inherit;
            transition: border-color .15s;
        }
        .input:focus, .select-field:focus { outline: none; border-color: var(--tv-green); box-shadow: 0 0 0 2px rgba(94,225,0,.12); }

        table { width: 100%; border-collapse: collapse; }
        thead th { background: var(--tv-gray-light); text-align: left; padding: 10px 14px; font-size: 11px; color: var(--tv-gray-medium); text-transform: uppercase; letter-spacing: .3px; border-bottom: 1px solid var(--tv-gray-border); }
        tbody td { padding: 10px 14px; border-bottom: 1px solid var(--tv-gray-border); vertical-align: top; }
        tbody tr:hover { background: rgba(94,225,0,.02); }

        .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
        .badge-green { background: rgba(46,125,50,.1); color: #2e7d32; }
        .badge-orange { background: rgba(255,140,0,.12); color: var(--tv-warning); }
        .badge-red { background: rgba(255,68,68,.12); color: var(--tv-danger); }
        .badge-gray { background: rgba(0,0,0,.06); color: var(--tv-gray-medium); }

        .muted { color: var(--tv-gray-medium); font-size: 12px; }
        .empty-state { text-align: center; padding: 48px 20px; color: var(--tv-gray-medium); }
        .empty-state h3 { color: var(--tv-black); font-size: 18px; font-weight: 700; margin-bottom: 8px; }

        .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }

        .json-pre { white-space: pre-wrap; font-family: 'SF Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace; background: var(--tv-gray-light); border: 1px solid var(--tv-gray-border); border-radius: 6px; padding: 8px; max-height: 160px; overflow: auto; font-size: 12px; }

        /* ===== DETAIL PANEL (replaces modals) ===== */
        .detail-panel {
            position: fixed;
            top: 0;
            right: -500px;
            width: 480px;
            height: 100vh;
            background: var(--tv-white);
            border-left: 1px solid var(--tv-gray-border);
            box-shadow: -4px 0 20px rgba(0,0,0,.08);
            z-index: 200;
            display: flex;
            flex-direction: column;
            transition: right .25s ease;
        }

        .detail-panel.open { right: 0; }

        .detail-panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--tv-gray-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .detail-panel-header h3 { font-size: 15px; font-weight: 700; }

        .detail-panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .detail-panel-footer {
            padding: 12px 20px;
            border-top: 1px solid var(--tv-gray-border);
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .detail-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.2);
            z-index: 199;
            display: none;
        }

        .detail-overlay.open { display: block; }

        /* ===== KANBAN (Funnel) ===== */
        .kanban-board { display: grid; grid-template-columns: repeat(5,1fr); gap: 12px; }
        .kanban-col { background: var(--tv-white); border: 1px solid var(--tv-gray-border); border-radius: 10px; min-height: 260px; display: flex; flex-direction: column; }
        .kanban-col-header { padding: 10px 12px; border-bottom: 1px solid var(--tv-gray-border); display: flex; justify-content: space-between; align-items: center; }
        .kanban-col-title { font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: .3px; }
        .kanban-col-body { padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 200px; max-height: 450px; overflow-y: auto; }
        .kanban-card { border: 1px solid var(--tv-gray-border); border-radius: 8px; padding: 8px 10px; background: var(--tv-white); cursor: grab; transition: border-color .15s; }
        .kanban-card:hover { border-color: var(--tv-black); }
        .kanban-card-name { font-weight: 700; font-size: 13px; }
        .kanban-card-sub { color: var(--tv-gray-medium); font-size: 11px; }
        .kanban-card-details { display: none; margin-top: 6px; }
        .kanban-card.expanded .kanban-card-details { display: block; }

        .chart-bars { display: flex; gap: 10px; align-items: flex-end; height: 120px; margin-top: 8px; }
        .chart-bar { flex: 1; background: linear-gradient(180deg, var(--tv-green), #baff7f); border-radius: 4px 4px 0 0; min-height: 4px; }
        .chart-labels { display: flex; gap: 10px; margin-top: 4px; }
        .chart-label { flex: 1; text-align: center; font-size: 11px; color: var(--tv-gray-medium); }

        /* ===== ARTICLE LIST ===== */
        .article-row {
            background: var(--tv-white);
            border: 1px solid var(--tv-gray-border);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all .15s;
            cursor: pointer;
        }
        .article-row:hover { border-color: var(--tv-black); background: rgba(94,225,0,.02); }
        .article-row.published { border-left: 3px solid #43a047; }
        .article-row .article-info { flex: 1; min-width: 0; }
        .article-row .article-title { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .article-row .article-meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--tv-gray-medium); margin-top: 3px; }
        .article-row .article-actions { display: flex; gap: 6px; flex-shrink: 0; }

        /* slots info */
        .slots-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .slot-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; background: rgba(46,125,50,.1); color: #2e7d32; }
        .slot-chip.full { background: rgba(255,140,0,.15); color: var(--tv-warning); }

        /* ===== HISTORY PANEL ===== */
        .history-item { border: 1px solid var(--tv-gray-border); border-radius: 8px; padding: 10px; margin-bottom: 8px; }

        /* ===== SUB-TABS ===== */
        .sub-tabs { display: flex; gap: 0; border-bottom: 2px solid var(--tv-gray-border); margin-bottom: 20px; }
        .sub-tab { padding: 10px 18px; font-size: 13px; font-weight: 600; color: var(--tv-gray-medium); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all .15s; white-space: nowrap; }
        .sub-tab:hover { color: var(--tv-black); }
        .sub-tab.active { color: var(--tv-gray-dark); border-bottom-color: #2e7d32; }
        .sub-tab-content { display: none; }
        .sub-tab-content.active { display: block; }

        /* ===== EXPANDABLE ARTICLE ===== */
        .article-expand { display: none; padding: 12px 0 0; border-top: 1px solid var(--tv-gray-border); margin-top: 10px; font-size: 13px; line-height: 1.6; color: var(--tv-gray-dark); }
        .article-row.expanded .article-expand { display: block; }
        .article-expand-label { font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .3px; color: var(--tv-gray-medium); margin-bottom: 4px; }
        .article-expand-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .expand-toggle { font-size: 11px; color: var(--tv-gray-medium); cursor: pointer; padding: 2px 8px; border: 1px solid var(--tv-gray-border); border-radius: 4px; background: var(--tv-white); transition: all .15s; }
        .expand-toggle:hover { border-color: var(--tv-black); color: var(--tv-black); }

        /* ===== NEWS DASHBOARD ===== */
        .dash-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .dash-card { background: var(--tv-white); border: 1px solid var(--tv-gray-border); border-radius: 10px; padding: 16px; text-align: center; }
        .dash-card .dash-num { font-size: 28px; font-weight: 800; color: var(--tv-black); line-height: 1.1; }
        .dash-card .dash-lbl { font-size: 11px; color: var(--tv-gray-medium); margin-top: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px; }
        .dash-section { margin-bottom: 28px; }
        .dash-section h3 { font-size: 14px; font-weight: 700; color: var(--tv-gray-dark); margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--tv-gray-border); }
        .dash-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12px; }
        .dash-bar-label { width: 160px; text-align: right; color: var(--tv-gray-dark); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; }
        .dash-bar-track { flex: 1; height: 22px; background: var(--tv-gray-light); border-radius: 4px; overflow: hidden; position: relative; }
        .dash-bar-fill { height: 100%; border-radius: 4px; display: flex; align-items: center; padding-left: 8px; font-size: 11px; font-weight: 700; color: #fff; min-width: 28px; transition: width .3s; }
        .dash-bar-count { font-size: 12px; color: var(--tv-gray-medium); min-width: 36px; text-align: right; flex-shrink: 0; }
        .dash-history-table { width: 100%; font-size: 12px; }
        .dash-history-table th { text-align: left; font-weight: 700; color: var(--tv-gray-medium); font-size: 11px; text-transform: uppercase; letter-spacing: .3px; padding: 6px 8px; border-bottom: 2px solid var(--tv-gray-border); }
        .dash-history-table td { padding: 8px; border-bottom: 1px solid var(--tv-gray-border); }
        .dash-history-table tr:hover { background: rgba(0,0,0,.02); }
        .dash-timeline-item { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--tv-gray-border); font-size: 12px; }
        .dash-timeline-date { min-width: 80px; font-weight: 700; color: var(--tv-gray-dark); }
        .dash-timeline-articles { flex: 1; display: flex; flex-wrap: wrap; gap: 6px; }
        .dash-timeline-chip { padding: 3px 8px; border-radius: 6px; font-size: 11px; background: rgba(46,125,50,.08); color: #2e7d32; border: 1px solid rgba(46,125,50,.15); }
        .dash-timeline-chip.slot-main { background: rgba(33,150,243,.1); color: #1565c0; border-color: rgba(33,150,243,.2); }
        .dash-timeline-chip.slot-premium { background: rgba(156,39,176,.08); color: #7b1fa2; border-color: rgba(156,39,176,.15); }
        .dash-timeline-chip.pinned { border-style: dashed; }
        .dash-inactive { color: var(--tv-gray-border); }

        /* ===== IMAGE UPLOAD ===== */
        .img-upload-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        .img-upload-item { border: 1px solid var(--tv-gray-border); border-radius: 8px; padding: 12px; }
        .img-upload-item h4 { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
        .img-upload-item p { font-size: 11px; color: var(--tv-gray-medium); margin-bottom: 8px; }
        .img-preview { width: 100%; height: 120px; border: 1px dashed var(--tv-gray-border); border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 8px; background: var(--tv-gray-light); }
        .img-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* ===== LP CONFIG ===== */
        .lp-field { margin-bottom: 16px; }
        .lp-field label { display: block; font-weight: 600; font-size: 12px; color: var(--tv-gray-dark); margin-bottom: 4px; }
        .lp-field input, .lp-field textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--tv-gray-border); border-radius: 6px; font-size: 13px; font-family: inherit; }
        .lp-field input:focus, .lp-field textarea:focus { outline: none; border-color: var(--tv-green); box-shadow: 0 0 0 2px rgba(94,225,0,.12); }
        .lp-field textarea { min-height: 60px; resize: vertical; }
        .lp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        /* ===== AUTOMATIONS ===== */
        .auto-card { border: 1px solid var(--tv-gray-border); border-radius: 10px; padding: 16px; margin-bottom: 12px; transition: all .15s; }
        .auto-card:hover { border-color: #bbb; }
        .auto-card-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .auto-card-info { flex: 1; min-width: 0; }
        .auto-card-name { font-weight: 700; font-size: 14px; }
        .auto-card-desc { font-size: 12px; color: var(--tv-gray-medium); margin-top: 2px; }
        .auto-card-meta { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 11px; color: var(--tv-gray-medium); }
        .auto-card-meta .meta-item { display: flex; align-items: center; gap: 4px; }
        .auto-status { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
        .auto-status.success { background: rgba(46,125,50,.1); color: #2e7d32; }
        .auto-status.failure { background: rgba(211,47,47,.1); color: #d32f2f; }
        .auto-status.running { background: rgba(245,124,0,.1); color: #f57c00; animation: pulse 1.5s infinite; }
        .auto-status.pending { background: rgba(158,158,158,.1); color: #757575; }
        .auto-status.disabled { background: rgba(158,158,158,.08); color: #9e9e9e; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
        .auto-trigger-btn { padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 600; border: 1px solid var(--tv-gray-border); background: var(--tv-white); cursor: pointer; transition: all .15s; white-space: nowrap; }
        .auto-trigger-btn:hover { border-color: var(--tv-black); background: var(--tv-black); color: var(--tv-white); }
        .auto-trigger-btn:disabled { opacity: .5; cursor: not-allowed; }
        .auto-trigger-btn.triggering { background: #f57c00; color: white; border-color: #f57c00; }
        .gh-token-bar { display: flex; gap: 8px; align-items: center; padding: 12px 16px; background: var(--tv-gray-light); border-radius: 8px; margin-bottom: 16px; }
        .gh-token-bar input { flex: 1; padding: 6px 10px; border: 1px solid var(--tv-gray-border); border-radius: 6px; font-size: 12px; font-family: monospace; }
        .gh-token-bar .muted { font-size: 11px; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 900px) {
            .sidebar { width: var(--sidebar-collapsed); }
            .sidebar .nav-label, .sidebar .logo-text, .sidebar-user, .nav-badge { display: none; }
            .sidebar-nav-item { justify-content: center; padding: 10px 8px; }
            .sidebar-nav-item .nav-icon { margin: 0; }
            .kanban-board { grid-template-columns: 1fr; }
            .detail-panel { width: 100%; right: -100%; }
        }

        @media (max-width: 600px) {
            .content-body { padding: 16px; }
            .article-row { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- SIDEBAR -->
        <aside class="sidebar">

    <script src="/auth-manager.js"></script>
    <script>
    // ============================================================
    // CORE CONFIG & ROUTING
    // ============================================================
    const SUPABASE_URL = 'https://mgcoyeohqelystqmytah.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_uvWYeXb6bFy-23rqo6aaTw__sFlNwBY';

    const ROUTES = {
        noticias:      { title: 'Noticias',      render: renderNoticias,      permission: null },
        leads:         { title: 'Leads',          render: renderLeads,         permission: 'manage_stats' },
        funil:         { title: 'Funil de Vendas', render: renderFunil,        permission: 'ver_funil' },
        estatisticas:  { title: 'Estatisticas',   render: renderEstatisticas,  permission: 'manage_stats' },
        usuarios:      { title: 'Usuarios',       render: renderUsuarios,      permission: 'manage_users' },
        campanhas:     { title: 'Campanhas',      render: renderCampanhas,     permission: 'manage_stats' },
        projetos:      { title: 'Projetos',       render: renderProjetos,      permission: 'manage_stats' },
        ferramentas:   { title: 'Ferramentas',    render: renderFerramentas,   permission: null },
        configuracoes: { title: 'Configuracoes',  render: renderConfiguracoes, permission: 'manage_users' }
    };

    let currentSection = null;

    function navigate(section) {
        location.hash = section;
    }

    function handleRoute() {
        const hash = (location.hash || '#noticias').slice(1).split('/')[0];
        const route = ROUTES[hash];
        if (!route) { navigate('noticias'); return; }

        if (route.permission && !window.authManager.hasPermission(route.permission)) {
            document.getElementById('content-body').innerHTML = '<div class="empty-state"><h3>Sem permissao</h3><p>Voce nao tem acesso a esta secao.</p></div>';
            return;
        }

        currentSection = hash;

        // Update sidebar
        document.querySelectorAll('.sidebar-nav-item').forEach(el => {
            el.classList.toggle('active', el.dataset.section === hash);
        });

        document.getElementById('page-title').textContent = route.title;
        document.getElementById('header-actions').innerHTML = '';

        const body = document.getElementById('content-body');
        body.innerHTML = '<div class="empty-state"><p>Carregando...</p></div>';
        route.render(body);
    }

    window.addEventListener('hashchange', handleRoute);

    document.addEventListener('DOMContentLoaded', () => {
        if (!window.authManager || !window.authManager.getCurrentUser()) return;
        const user = window.authManager.getCurrentUser();
        document.getElementById('sidebar-user').textContent = user.username || user.name || '';
        handleRoute();
    });

    function doLogout() {
        window.authManager.logout();
    }

    // ============================================================
    // SUPABASE HELPERS
    // ============================================================
    async function sbFetch(path, opts = {}) {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
            ...opts,
            headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json', ...(opts.headers || {}) }
        });
        if (!res.ok) throw new Error(await res.text());
        const ct = res.headers.get('content-type') || '';
        return ct.includes('json') ? res.json() : null;
    }

    function esc(s) { return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
    function truncate(s, n=120) { const c = esc(s); return c.length > n ? c.slice(0,n) + '...' : c; }
    function fmtDate(d) { return d ? new Date(d).toLocaleDateString('pt-BR') : '-'; }
    function fmtDateTime(d) { return d ? new Date(d).toLocaleString('pt-BR') : '-'; }

    // ============================================================
    // DETAIL PANEL
    // ============================================================
    function openDetailPanel(title, bodyHtml, footerHtml) {
        document.getElementById('detail-title').textContent = title;
        document.getElementById('detail-body').innerHTML = bodyHtml;
        document.getElementById('detail-footer').innerHTML = footerHtml || '';
        document.getElementById('detail-panel').classList.add('open');
        document.getElementById('detail-overlay').classList.add('open');
    }

    function closeDetailPanel() {
        document.getElementById('detail-panel').classList.remove('open');
        document.getElementById('detail-overlay').classList.remove('open');
    }

    // ============================================================
    // SECTION: NOTICIAS
    // ============================================================
    const SLOT_LIMITS = { main: 1, premium: 3, others: 4 };

    function getSlotKey(priority) {
        if (priority === 2) return 'main';
        if (priority === 1) return 'premium';
        return 'others';
    }

    let newsActiveTab = 'news-no-ar';

    async function renderNoticias(container) {
        try {
            const [articles, categories] = await Promise.all([
                sbFetch('news_articles?select=*,news_categories(name),news_sources(name)&order=created_at.desc'),
                sbFetch('news_categories?select=id,name&is_active=eq.true&order=name')
            ]);

            // Cache articles for tab switching
            window._newsArticles = articles;
            window._newsCategories = categories;

            const published = articles.filter(a => a.is_published);
            const slotCounts = { main: 0, premium: 0, others: 0 };
            published.forEach(a => { slotCounts[getSlotKey(a.priority)] += 1; });

            const stats = {
                total: articles.length,
                pending: articles.filter(a => a.status === 'pending').length,
                approved: articles.filter(a => a.status === 'approved').length,
                published: published.length,
                rejected: articles.filter(a => a.status === 'rejected').length
            };

            container.innerHTML = `
                <div class="stats-row">
                    <div class="stat-chip"><span class="num">${stats.total}</span><span class="lbl">Total</span></div>
                    <div class="stat-chip"><span class="num">${stats.approved}</span><span class="lbl">Aprovados</span></div>
                    <div class="stat-chip"><span class="num">${stats.published}</span><span class="lbl">Publicados</span></div>
                    <div class="stat-chip"><span class="num">${stats.pending}</span><span class="lbl">Pendentes</span></div>
                    <div class="stat-chip"><span class="num">${stats.rejected}</span><span class="lbl">Rejeitados</span></div>
                </div>

                <div class="slots-bar">
                    <span class="slot-chip ${slotCounts.main >= 1 ? 'full' : ''}">Principal: ${slotCounts.main}/1</span>
                    <span class="slot-chip ${slotCounts.premium >= 3 ? 'full' : ''}">Premium: ${slotCounts.premium}/3</span>
                    <span class="slot-chip ${slotCounts.others >= 4 ? 'full' : ''}">Outros: ${slotCounts.others}/4</span>
                    <span class="muted" style="margin-left:8px">${published.length}/8 no site</span>
                </div>

                <div class="sub-tabs" id="news-tabs">
                    <div class="sub-tab ${newsActiveTab === 'news-no-ar' ? 'active' : ''}" data-tab="news-no-ar" onclick="switchNewsTab('news-no-ar')">No Ar</div>
                    <div class="sub-tab ${newsActiveTab === 'news-dashboard' ? 'active' : ''}" data-tab="news-dashboard" onclick="switchNewsTab('news-dashboard')">Dashboard</div>
                    <div class="sub-tab ${newsActiveTab === 'news-feedback' ? 'active' : ''}" data-tab="news-feedback" onclick="switchNewsTab('news-feedback')">Feedback</div>
                    <div class="sub-tab ${newsActiveTab === 'news-todas' ? 'active' : ''}" data-tab="news-todas" onclick="switchNewsTab('news-todas')">Todas</div>
                </div>
                <div id="news-tab-body"></div>
            `;

            switchNewsTab(newsActiveTab);
        } catch (e) {
            container.innerHTML = `<div class="empty-state"><h3>Erro</h3><p>${esc(e.message)}</p></div>`;
        }
    }

    function switchNewsTab(tab) {
        newsActiveTab = tab;
        document.querySelectorAll('#news-tabs .sub-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
        const body = document.getElementById('news-tab-body');
        if (tab === 'news-no-ar') renderNewsNoAr(body);
        else if (tab === 'news-dashboard') renderNewsDashboard(body);
        else if (tab === 'news-feedback') renderNewsFeedback(body);
        else renderNewsTodas(body);
    }

    function renderNewsNoAr(container) {
        const articles = window._newsArticles || [];
        const now = new Date();
        const cutoff3d = new Date(now - 3 * 86400000);

        // Currently live
        const live = articles
            .filter(a => a.is_published)
            .sort((a, b) => (b.priority || 0) - (a.priority || 0));

        // Recently published (last 3 days, not currently live)
        const recent = articles
            .filter(a => !a.is_published && a.status === 'approved' && new Date(a.published_at || a.created_at) >= cutoff3d)
            .sort((a, b) => new Date(b.published_at || b.created_at) - new Date(a.published_at || a.created_at));

        container.innerHTML = `
            <div style="margin-bottom:24px">
                <h3 style="font-size:15px;font-weight:700;margin-bottom:12px;color:var(--tv-gray-dark)">No ar agora (${live.length}/8 slots)</h3>
                <div id="news-live-list"></div>
            </div>
            ${recent.length ? `
            <div>
                <h3 style="font-size:15px;font-weight:700;margin-bottom:12px;color:var(--tv-gray-medium)">Saiu do ar nos ultimos 3 dias (${recent.length})</h3>
                <div id="news-recent-list"></div>
            </div>` : ''}
        `;

        renderNewsList(live, 'news-live-list');
        if (recent.length) renderNewsList(recent, 'news-recent-list');
    }

    async function renderNewsDashboard(container) {
        container.innerHTML = '<div class="empty-state"><p>Carregando dashboard...</p></div>';

        try {
            const articles = window._newsArticles || [];
            const now = new Date();

            // ---- Compute all data client-side from cached articles ----
            // Group by day
            const byDay = {};
            articles.forEach(a => {
                const day = (a.created_at || '').slice(0, 10);
                if (!day) return;
                if (!byDay[day]) byDay[day] = { coletadas: 0, aprovadas: 0, pendentes: 0, rejeitadas: 0, publicadas: 0, scores: [], fontes: new Set(), categorias: new Set() };
                const d = byDay[day];
                d.coletadas++;
                if (a.status === 'approved') d.aprovadas++;
                if (a.status === 'pending') d.pendentes++;
                if (a.status === 'rejected') d.rejeitadas++;
                if (a.is_published) d.publicadas++;
                if (a.relevance_score != null) d.scores.push(a.relevance_score);
                if (a.news_sources?.name) d.fontes.add(a.news_sources.name);
                if (a.news_categories?.name) d.categorias.add(a.news_categories.name);
            });
            const days = Object.keys(byDay).sort().reverse();
            const last14 = days.slice(0, 14);

            // Today
            const todayStr = now.toISOString().slice(0, 10);
            const todayData = byDay[todayStr] || { coletadas: 0 };

            // Last 30 days average
            const last30 = days.filter(d => new Date(d) >= new Date(now - 30 * 86400000));
            const avgDaily = last30.length ? (last30.reduce((s, d) => s + byDay[d].coletadas, 0) / last30.length).toFixed(1) : '0';

            // Published articles score avg
            const publishedArticles = articles.filter(a => a.is_published);
            const allScores = publishedArticles.filter(a => a.relevance_score != null).map(a => a.relevance_score);
            const avgScore = allScores.length ? (allScores.reduce((a, b) => a + b, 0) / allScores.length).toFixed(1) : '—';

            // Feedback count
            const withFeedback = articles.filter(a => a.human_feedback).length;

            // Approval rate
            const approved = articles.filter(a => a.status === 'approved').length;
            const approvalRate = articles.length ? Math.round(approved / articles.length * 100) : 0;

            // By source
            const bySource = {};
            articles.forEach(a => {
                const name = a.news_sources?.name || 'Desconhecida';
                bySource[name] = (bySource[name] || 0) + 1;
            });
            const sourceEntries = Object.entries(bySource).sort((a, b) => b[1] - a[1]);
            const maxSource = sourceEntries.length ? sourceEntries[0][1] : 1;

            // By category
            const byCat = {};
            articles.forEach(a => {
                const name = a.news_categories?.name || 'Sem categoria';
                byCat[name] = (byCat[name] || 0) + 1;
            });
            const catEntries = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
            const maxCat = catEntries.length ? catEntries[0][1] : 1;

            // Timeline: published articles grouped by published_at date (last 7 days)
            const cutoff7 = new Date(now - 7 * 86400000);
            const pubByDay = {};
            articles.filter(a => a.status === 'approved').forEach(a => {
                const pDate = (a.published_at || a.created_at || '').slice(0, 10);
                if (!pDate || new Date(pDate) < cutoff7) return;
                if (!pubByDay[pDate]) pubByDay[pDate] = [];
                pubByDay[pDate].push(a);
            });
            const pubDays = Object.keys(pubByDay).sort().reverse();

            // ---- Render ----
            container.innerHTML = `
                <div class="dash-cards">
                    <div class="dash-card"><div class="dash-num">${todayData.coletadas}</div><div class="dash-lbl">Coletadas Hoje</div></div>
                    <div class="dash-card"><div class="dash-num">${avgDaily}</div><div class="dash-lbl">Media/Dia (30d)</div></div>
                    <div class="dash-card"><div class="dash-num">${articles.length}</div><div class="dash-lbl">Total no Banco</div></div>
                    <div class="dash-card"><div class="dash-num">${avgScore}</div><div class="dash-lbl">Score Medio IA</div></div>
                    <div class="dash-card"><div class="dash-num">${withFeedback}</div><div class="dash-lbl">Com Feedback</div></div>
                    <div class="dash-card"><div class="dash-num">${approvalRate}%</div><div class="dash-lbl">Taxa Aprovacao</div></div>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px">
                    <div class="dash-section">
                        <h3>Noticias por Fonte</h3>
                        ${sourceEntries.map(([name, count]) => `
                            <div class="dash-bar-row">
                                <div class="dash-bar-label ${count === 0 ? 'dash-inactive' : ''}">${esc(name)}</div>
                                <div class="dash-bar-track">
                                    <div class="dash-bar-fill" style="width:${Math.max(count / maxSource * 100, count > 0 ? 3 : 0)}%;background:#1565c0">${count > 0 ? '' : ''}</div>
                                </div>
                                <div class="dash-bar-count">${count}</div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="dash-section">
                        <h3>Noticias por Categoria</h3>
                        ${catEntries.map(([name, count]) => `
                            <div class="dash-bar-row">
                                <div class="dash-bar-label">${esc(name)}</div>
                                <div class="dash-bar-track">
                                    <div class="dash-bar-fill" style="width:${Math.max(count / maxCat * 100, 3)}%;background:#7b1fa2"></div>
                                </div>
                                <div class="dash-bar-count">${count}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="dash-section">
                    <h3>Historico Diario (ultimos 14 dias)</h3>
                    <div class="card" style="overflow-x:auto">
                        <table class="dash-history-table">
                            <thead><tr>
                                <th>Data</th><th>Coletadas</th><th>Aprovadas</th><th>Pendentes</th><th>Rejeitadas</th><th>Publicadas</th><th>Score Medio</th><th>Fontes</th>
                            </tr></thead>
                            <tbody>
                                ${last14.map(day => {
                                    const d = byDay[day];
                                    const avg = d.scores.length ? (d.scores.reduce((a,b) => a+b, 0) / d.scores.length).toFixed(1) : '—';
                                    const isToday = day === todayStr;
                                    return `<tr style="${isToday ? 'background:rgba(46,125,50,.04);font-weight:600' : ''}">
                                        <td>${isToday ? '<strong>Hoje</strong>' : fmtDate(day)}</td>
                                        <td>${d.coletadas}</td>
                                        <td>${d.aprovadas}</td>
                                        <td>${d.pendentes}</td>
                                        <td>${d.rejeitadas}</td>
                                        <td>${d.publicadas}</td>
                                        <td>${avg}</td>
                                        <td class="muted">${[...d.fontes].join(', ') || '—'}</td>
                                    </tr>`;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="dash-section">
                    <h3>Publicadas no Site (ultimos 7 dias)</h3>
                    ${pubDays.length ? pubDays.map(day => {
                        const dayArticles = pubByDay[day];
                        const isToday = day === todayStr;
                        return `<div class="dash-timeline-item">
                            <div class="dash-timeline-date">${isToday ? 'Hoje' : fmtDate(day)}</div>
                            <div class="dash-timeline-articles">
                                ${dayArticles.map(a => {
                                    const slot = getSlotKey(a.priority);
                                    const slotClass = slot === 'main' ? 'slot-main' : slot === 'premium' ? 'slot-premium' : '';
                                    const pinnedClass = a.manually_pinned ? 'pinned' : '';
                                    return `<span class="dash-timeline-chip ${slotClass} ${pinnedClass}" title="${esc(a.title)}${a.relevance_score ? ' | Score: '+a.relevance_score : ''}${a.is_published ? ' | No ar' : ' | Saiu do ar'}">
                                        ${a.is_published ? '●' : '○'} ${truncate(a.title, 50)}${a.relevance_score ? ' <span style="opacity:.6">(${a.relevance_score})</span>' : ''}
                                    </span>`;
                                }).join('')}
                            </div>
                        </div>`;
                    }).join('') : '<div class="empty-state"><p>Nenhuma noticia aprovada nos ultimos 7 dias.</p></div>'}
                </div>
            `;
        } catch (e) {
            container.innerHTML = `<div class="empty-state"><h3>Erro</h3><p>${esc(e.message)}</p></div>`;
        }
    }

    async function renderNewsFeedback(container) {
        const articles = window._newsArticles || [];

        // Stats
        const withAdminScore = articles.filter(a => a.human_score != null);
        const withUserRating = articles.filter(a => a.user_avg_rating && a.user_rating_count > 0);
        const withBoth = articles.filter(a => a.human_score != null && a.user_avg_rating && a.user_rating_count > 0);

        const avgAdmin = withAdminScore.length ? (withAdminScore.reduce((s,a) => s + parseFloat(a.human_score), 0) / withAdminScore.length) : 0;
        const avgUser = withUserRating.length ? (withUserRating.reduce((s,a) => s + parseFloat(a.user_avg_rating), 0) / withUserRating.length) : 0;
        const totalUserRatings = articles.reduce((s,a) => s + (a.user_rating_count || 0), 0);

        // Concordancia: % onde diferença entre admin (0-10) e user (1-5 * 2) é <= 2 pontos
        let concordancia = 0;
        if (withBoth.length > 0) {
            const concordantes = withBoth.filter(a => {
                const diff = Math.abs(parseFloat(a.human_score) - parseFloat(a.user_avg_rating) * 2);
                return diff <= 2;
            });
            concordancia = Math.round((concordantes.length / withBoth.length) * 100);
        }

        // Buscar pesos atuais
        let weightAdmin = 0.5, weightUser = 0.5;
        try {
            const settings = await sbFetch('news_settings?select=key,value');
            settings.forEach(s => {
                if (s.key === 'weight_admin') weightAdmin = parseFloat(s.value) || 0.5;
                if (s.key === 'weight_user') weightUser = parseFloat(s.value) || 0.5;
            });
        } catch(e) {}

        // Buscar ultimos ratings dos leitores
        let recentRatings = [];
        try {
            recentRatings = await sbFetch('news_ratings?select=*,news_articles(title)&order=created_at.desc&limit=20');
        } catch(e) {}

        // Artigos com feedback para tabela comparativa
        const feedbackArticles = articles
            .filter(a => a.human_score != null || (a.user_avg_rating && a.user_rating_count > 0))
            .sort((a,b) => {
                const sa = parseFloat(a.human_score || a.relevance_score || 0);
                const sb = parseFloat(b.human_score || b.relevance_score || 0);
                return sb - sa;
            });

        container.innerHTML = `
            <!-- CARDS RESUMO -->
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:20px">
                <div class="card" style="padding:14px;text-align:center">
                    <div style="font-size:22px;font-weight:700;color:#1565c0">${avgAdmin ? avgAdmin.toFixed(1) : '-'}</div>
                    <div class="muted" style="font-size:11px">Score Medio Editor</div>
                    <div class="muted" style="font-size:10px">${withAdminScore.length} artigos</div>
                </div>
                <div class="card" style="padding:14px;text-align:center">
                    <div style="font-size:22px;font-weight:700;color:#f9a825">${avgUser ? avgUser.toFixed(1) + '★' : '-'}</div>
                    <div class="muted" style="font-size:11px">Rating Medio Leitores</div>
                    <div class="muted" style="font-size:10px">${withUserRating.length} artigos</div>
                </div>
                <div class="card" style="padding:14px;text-align:center">
                    <div style="font-size:22px;font-weight:700">${totalUserRatings}</div>
                    <div class="muted" style="font-size:11px">Total Avaliacoes Leitores</div>
                </div>
                <div class="card" style="padding:14px;text-align:center">
                    <div style="font-size:22px;font-weight:700;color:${concordancia >= 70 ? '#2e7d32' : concordancia >= 40 ? '#f57c00' : '#d32f2f'}">${withBoth.length > 0 ? concordancia + '%' : '-'}</div>
                    <div class="muted" style="font-size:11px">Concordancia</div>
                    <div class="muted" style="font-size:10px">Editor x Leitor</div>
                </div>
            </div>

            <!-- PESOS -->
            <div class="card" style="padding:16px;margin-bottom:20px">
                <div class="card-title" style="margin-bottom:12px">Pesos de Feedback (influenciam a selecao automatica)</div>
                <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
                    <div style="flex:1;min-width:180px">
                        <label class="muted" style="font-size:12px">Peso Editor/IA</label>
                        <div style="display:flex;align-items:center;gap:8px">
                            <input type="range" id="weight-admin-slider" min="0" max="100" value="${Math.round(weightAdmin * 100)}"
                                oninput="syncWeightSliders('admin')" style="flex:1">
                            <span id="weight-admin-val" style="font-weight:700;font-size:14px;min-width:40px">${Math.round(weightAdmin * 100)}%</span>
                        </div>
                    </div>
                    <div style="flex:1;min-width:180px">
                        <label class="muted" style="font-size:12px">Peso Leitores</label>
                        <div style="display:flex;align-items:center;gap:8px">
                            <input type="range" id="weight-user-slider" min="0" max="100" value="${Math.round(weightUser * 100)}"
                                oninput="syncWeightSliders('user')" style="flex:1">
                            <span id="weight-user-val" style="font-weight:700;font-size:14px;min-width:40px">${Math.round(weightUser * 100)}%</span>
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="saveWeights()" style="white-space:nowrap">Salvar pesos</button>
                </div>
                <p class="muted" style="font-size:11px;margin-top:8px">Os pesos devem somar 100%. Ao mover um, o outro se ajusta automaticamente.</p>
            </div>

            <!-- TABELA COMPARATIVA -->
            <div class="card" style="padding:16px;margin-bottom:20px">
                <div class="card-title" style="margin-bottom:12px">Comparativo de Scores (${feedbackArticles.length} artigos com feedback)</div>
                <div style="overflow-x:auto">
                    <table>
                        <thead>
                            <tr>
                                <th>Artigo</th>
                                <th style="text-align:center">Score IA</th>
                                <th style="text-align:center">Score Editor</th>
                                <th style="text-align:center">Rating Leitores</th>
                                <th style="text-align:center">Score Final</th>
                                <th style="text-align:center">Divergencia</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${feedbackArticles.slice(0, 30).map(a => {
                                const aiScore = parseFloat(a.relevance_score || 0);
                                const adminScore = a.human_score != null ? parseFloat(a.human_score) : null;
                                const userRating = (a.user_avg_rating && a.user_rating_count > 0) ? parseFloat(a.user_avg_rating) : null;
                                const userScaled = userRating ? userRating * 2 : null;

                                // Calcular score final com pesos
                                let finalScore;
                                if (adminScore !== null && userScaled !== null) {
                                    finalScore = ((adminScore * weightAdmin) + (userScaled * weightUser)) / (weightAdmin + weightUser);
                                } else if (adminScore !== null) {
                                    finalScore = adminScore;
                                } else if (userScaled !== null) {
                                    finalScore = userScaled;
                                } else {
                                    finalScore = aiScore;
                                }

                                // Divergencia entre editor e leitor
                                let divergence = '';
                                let divColor = '';
                                if (adminScore !== null && userScaled !== null) {
                                    const diff = Math.abs(adminScore - userScaled);
                                    divergence = diff.toFixed(1);
                                    divColor = diff <= 1 ? '#2e7d32' : diff <= 3 ? '#f57c00' : '#d32f2f';
                                }

                                const fb = a.human_feedback;
                                return `<tr>
                                    <td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                                        ${esc(a.title?.slice(0,60) || '')}
                                        ${fb === 'bom' ? ' <span style="color:#2e7d32">&#128077;</span>' : fb === 'ruim' ? ' <span style="color:#d32f2f">&#128078;</span>' : ''}
                                    </td>
                                    <td style="text-align:center;color:#888">${aiScore || '-'}</td>
                                    <td style="text-align:center;font-weight:700;color:${adminScore !== null ? '#1565c0' : '#ccc'}">${adminScore !== null ? adminScore : '-'}</td>
                                    <td style="text-align:center;color:#f9a825;font-weight:700">${userRating ? userRating.toFixed(1) + '★ <span style="font-weight:400;color:#888;font-size:10px">(' + (a.user_rating_count||0) + ')</span>' : '-'}</td>
                                    <td style="text-align:center;font-weight:700">${finalScore.toFixed(1)}</td>
                                    <td style="text-align:center;font-weight:700;color:${divColor}">${divergence || '-'}</td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- TIMELINE RATINGS LEITORES -->
            <div class="card" style="padding:16px">
                <div class="card-title" style="margin-bottom:12px">Ultimas avaliacoes dos leitores</div>
                ${recentRatings.length === 0
                    ? '<p class="muted" style="font-size:12px">Nenhuma avaliacao de leitores ainda. As estrelas aparecem nas paginas de noticias do site.</p>'
                    : `<div style="display:flex;flex-direction:column;gap:8px">
                        ${recentRatings.map(r => {
                            const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
                            const title = r.news_articles?.title || 'Artigo #' + r.article_id;
                            const ago = fmtDateTime(r.created_at);
                            return `<div style="display:flex;align-items:center;gap:8px;font-size:12px;padding:6px 0;border-bottom:1px solid var(--tv-gray-border)">
                                <span style="color:#f9a825;font-size:14px;min-width:70px">${stars}</span>
                                <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(title.slice(0,60))}</span>
                                <span class="muted" style="white-space:nowrap">${ago}</span>
                            </div>`;
                        }).join('')}
                    </div>`
                }
            </div>
        `;
    }

    function syncWeightSliders(changed) {
        const adminSlider = document.getElementById('weight-admin-slider');
        const userSlider = document.getElementById('weight-user-slider');
        if (!adminSlider || !userSlider) return;

        if (changed === 'admin') {
            userSlider.value = 100 - parseInt(adminSlider.value);
        } else {
            adminSlider.value = 100 - parseInt(userSlider.value);
        }

        document.getElementById('weight-admin-val').textContent = adminSlider.value + '%';
        document.getElementById('weight-user-val').textContent = userSlider.value + '%';
    }

    async function saveWeights() {
        const adminVal = parseInt(document.getElementById('weight-admin-slider')?.value || 50) / 100;
        const userVal = parseInt(document.getElementById('weight-user-slider')?.value || 50) / 100;

        try {
            await Promise.all([
                sbFetch('news_settings?key=eq.weight_admin', { method: 'PATCH', body: JSON.stringify({ value: String(adminVal) }) }),
                sbFetch('news_settings?key=eq.weight_user', { method: 'PATCH', body: JSON.stringify({ value: String(userVal) }) })
            ]);
            alert('Pesos salvos! Editor: ' + Math.round(adminVal * 100) + '% | Leitores: ' + Math.round(userVal * 100) + '%');
        } catch (e) {
            alert('Erro ao salvar: ' + e.message);
        }
    }

    function renderNewsTodas(container) {
        const articles = window._newsArticles || [];
        const categories = window._newsCategories || [];
        const catOpts = categories.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');

        container.innerHTML = `
            <div class="toolbar" style="flex-wrap:wrap">
                <select class="select-field" id="news-filter-period">
                    <option value="">Todos os periodos</option>
                    <option value="today">Publicadas Hoje</option>
                    <option value="7days">Ultimos 7 dias</option>
                    <option value="30days">Ultimos 30 dias</option>
                </select>
                <select class="select-field" id="news-filter-status">
                    <option value="">Todos</option>
                    <option value="pending">Pendentes</option>
                    <option value="approved">Aprovados</option>
                    <option value="rejected">Rejeitados</option>
                </select>
                <select class="select-field" id="news-filter-cat">
                    <option value="">Categorias</option>
                    ${catOpts}
                </select>
                <select class="select-field" id="news-filter-feedback">
                    <option value="">Feedback</option>
                    <option value="good">Bom</option>
                    <option value="bad">Ruim</option>
                    <option value="none">Sem feedback</option>
                </select>
                <input class="input" id="news-search" placeholder="Buscar titulo..." style="min-width:200px">
                <button class="btn" onclick="renderNoticias(document.getElementById('content-body'))">Atualizar</button>
            </div>
            <div id="news-list"></div>
        `;

        renderNewsList(articles);

        // Filter handlers
        const applyFilters = () => {
            const s = document.getElementById('news-filter-status').value;
            const c = document.getElementById('news-filter-cat').value;
            const q = document.getElementById('news-search').value.toLowerCase();
            const p = document.getElementById('news-filter-period').value;
            const fb = document.getElementById('news-filter-feedback').value;
            let filtered = articles;
            if (s) filtered = filtered.filter(a => a.status === s);
            if (c) filtered = filtered.filter(a => String(a.category_id) === c);
            if (q) filtered = filtered.filter(a => (a.title||'').toLowerCase().includes(q));
            if (p) {
                const now = new Date();
                let cutoff;
                if (p === 'today') { cutoff = new Date(now.getFullYear(), now.getMonth(), now.getDate()); }
                else if (p === '7days') { cutoff = new Date(now - 7*86400000); }
                else if (p === '30days') { cutoff = new Date(now - 30*86400000); }
                if (cutoff) filtered = filtered.filter(a => a.is_published && new Date(a.published_at || a.created_at) >= cutoff);
            }
            if (fb === 'good') filtered = filtered.filter(a => a.human_feedback === 'good');
            else if (fb === 'bad') filtered = filtered.filter(a => a.human_feedback === 'bad');
            else if (fb === 'none') filtered = filtered.filter(a => !a.human_feedback);
            renderNewsList(filtered);
        };

        document.getElementById('news-filter-period').onchange = applyFilters;
        document.getElementById('news-filter-status').onchange = applyFilters;
        document.getElementById('news-filter-cat').onchange = applyFilters;
        document.getElementById('news-filter-feedback').onchange = applyFilters;
        document.getElementById('news-search').oninput = applyFilters;
    }

    function renderNewsList(articles, containerId) {
        const list = document.getElementById(containerId || 'news-list');
        if (!list) return;
        if (!articles.length) {
            list.innerHTML = '<div class="empty-state"><h3>Nenhum artigo</h3><p>Nenhum artigo encontrado.</p></div>';
            return;
        }

        list.innerHTML = articles.map(a => {
            const statusBadge = a.status === 'pending' ? '<span class="badge badge-orange">Pendente</span>'
                : a.status === 'approved' ? '<span class="badge badge-green">Aprovado</span>'
                : '<span class="badge badge-red">Rejeitado</span>';

            const pubBadge = a.is_published ? '<span class="badge badge-green">No site</span>' : '';
            const pinBadge = a.manually_pinned ? '<span class="badge badge-gray">Fixado</span>' : '';
            const slotLabel = a.is_published ? getSlotKey(a.priority).toUpperCase() : '';
            const catName = a.news_categories?.name || '';
            const srcName = a.news_sources?.name || '';

            // Parse commercial analysis for expandable section
            let caHtml = '';
            if (a.commercial_analysis) {
                try {
                    const ca = typeof a.commercial_analysis === 'string' ? JSON.parse(a.commercial_analysis) : a.commercial_analysis;
                    const fields = [
                        ['Impacto', ca.business_impact],
                        ['Oportunidades', ca.sales_opportunities],
                        ['Vantagem', ca.competitive_advantage],
                        ['Acoes', ca.action_items],
                        ['Riscos', ca.risk_factors],
                        ['Tendencias', ca.market_trends]
                    ].filter(f => f[1]);
                    if (fields.length) {
                        caHtml = `<div class="article-expand-grid">${fields.map(([l,v]) =>
                            `<div><div class="article-expand-label">${l}</div><div class="muted">${esc(v)}</div></div>`
                        ).join('')}</div>`;
                    }
                } catch(_) {}
            }

            // Slot allocation info
            const slotInfo = a.is_published
                ? `<span class="badge badge-green">${getSlotKey(a.priority) === 'main' ? 'Principal (1/1)' : getSlotKey(a.priority) === 'premium' ? 'Premium (3/3)' : 'Demais noticias (4/4)'}</span>`
                : '<span class="muted">Nao alocado</span>';

            return `
                <div class="article-row ${a.is_published ? 'published' : ''}">
                    <div style="display:flex;flex-direction:column;gap:2px;align-items:center;min-width:60px">
                        ${statusBadge}
                        ${pubBadge}
                        ${pinBadge}
                    </div>
                    <div class="article-info">
                        <div class="article-title" onclick="openArticleDetail(${a.id})" style="cursor:pointer">${esc(a.title)}</div>
                        <div class="article-meta">
                            ${srcName ? `<span>${esc(srcName)}</span>` : ''}
                            <span>${fmtDate(a.published_at || a.created_at)}</span>
                            ${catName ? `<span>${esc(catName)}</span>` : ''}
                            ${slotLabel ? `<span>Slot: ${slotLabel}</span>` : ''}
                            ${a.relevance_score ? `<span>Score: ${a.relevance_score}</span>` : ''}
                        </div>
                        <div class="article-expand">
                            <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;align-items:flex-start">
                                <div style="flex:1;min-width:140px">
                                    <div class="article-expand-label">Alocacao</div>
                                    <div>${slotInfo}</div>
                                </div>
                                <div style="min-width:160px">
                                    <div class="article-expand-label">Score IA: ${a.relevance_score ?? '—'}</div>
                                    <div style="display:flex;align-items:center;gap:8px;margin-top:4px">
                                        <input type="number" min="0" max="10" step="0.5" value="${a.human_score ?? a.relevance_score ?? ''}"
                                            class="input" style="width:70px;padding:6px 8px;font-size:13px" id="hscore-${a.id}" placeholder="0-10">
                                        <button class="btn btn-sm" onclick="saveHumanScore(${a.id})">Salvar</button>
                                    </div>
                                </div>
                                <div style="min-width:160px">
                                    <div class="article-expand-label">Feedback</div>
                                    <div style="display:flex;gap:6px;margin-top:4px">
                                        <button class="btn btn-sm ${a.human_feedback === 'good' ? 'btn-success' : ''}" onclick="saveHumanFeedback(${a.id},'good',this)" title="Boa escolha">👍 Bom</button>
                                        <button class="btn btn-sm ${a.human_feedback === 'bad' ? 'btn-danger' : ''}" onclick="saveHumanFeedback(${a.id},'bad',this)" title="Escolha ruim">👎 Ruim</button>
                                    </div>
                                    ${a.human_feedback ? `<div class="muted" style="font-size:11px;margin-top:4px">Avaliado: ${a.human_feedback === 'good' ? 'Bom' : 'Ruim'}${a.feedback_at ? ' em ' + fmtDate(a.feedback_at) : ''}</div>` : ''}
                                </div>
                            </div>
                            ${a.executive_summary ? `<div style="margin-bottom:10px"><div class="article-expand-label">Resumo Executivo</div><div class="muted">${esc(a.executive_summary)}</div></div>` : ''}
                            ${a.excerpt ? `<div style="margin-bottom:10px"><div class="article-expand-label">Trecho</div><div class="muted">${truncate(a.excerpt, 300)}</div></div>` : ''}
                            ${caHtml ? `<div style="margin-bottom:10px"><div class="article-expand-label" style="margin-bottom:8px">Analise Comercial</div>${caHtml}</div>` : ''}
                        </div>
                    </div>
                    <div class="article-actions" onclick="event.stopPropagation()" style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">
                        <button class="expand-toggle" onclick="toggleArticleExpand(this)">Expandir</button>
                        ${!a.is_published ? `<button class="btn btn-sm btn-success" onclick="publishArticle(${a.id})">Publicar</button>` : `<button class="btn btn-sm btn-warning" onclick="unpublishArticle(${a.id})">Despublicar</button>`}
                        ${!a.manually_pinned ? `<button class="btn btn-sm" onclick="pinArticle(${a.id}, true)">Fixar</button>` : `<button class="btn btn-sm" onclick="pinArticle(${a.id}, false)">Desfixar</button>`}
                        ${a.status !== 'rejected' ? `<button class="btn btn-sm btn-danger" onclick="rejectArticle(${a.id})">Rejeitar</button>` : `<button class="btn btn-sm" onclick="restoreArticle(${a.id})">Restaurar</button>`}
                    </div>
                </div>
            `;
        }).join('');
    }

    function toggleArticleExpand(btn) {
        const row = btn.closest('.article-row');
        row.classList.toggle('expanded');
        btn.textContent = row.classList.contains('expanded') ? 'Recolher' : 'Expandir';
    }

    async function openArticleDetail(id) {
        try {
            const articles = await sbFetch(`news_articles?id=eq.${id}&select=*,news_categories(name),news_sources(name)`);
            const a = articles[0];
            if (!a) return;

            let commercial = '';
            if (a.commercial_analysis) {
                try {
                    const ca = typeof a.commercial_analysis === 'string' ? JSON.parse(a.commercial_analysis) : a.commercial_analysis;
                    commercial = `
                        <div style="margin-top:16px">
                            <h4 style="font-size:13px;font-weight:700;margin-bottom:8px">Analise Comercial</h4>
                            <div class="muted"><strong>Impacto:</strong> ${esc(ca.business_impact || '')}</div>
                            <div class="muted"><strong>Oportunidades:</strong> ${esc(ca.sales_opportunities || '')}</div>
                            <div class="muted"><strong>Vantagem:</strong> ${esc(ca.competitive_advantage || '')}</div>
                            <div class="muted"><strong>Acoes:</strong> ${esc(ca.action_items || '')}</div>
                            <div class="muted"><strong>Riscos:</strong> ${esc(ca.risk_factors || '')}</div>
                            <div class="muted"><strong>Tendencias:</strong> ${esc(ca.market_trends || '')}</div>
                        </div>
                    `;
                } catch(_) {}
            }

            const body = `
                <div class="muted" style="margin-bottom:8px">
                    ${esc(a.news_categories?.name || '')} &middot; ${esc(a.news_sources?.name || '')} &middot; ${fmtDateTime(a.published_at || a.created_at)}
                    ${a.relevance_score ? ` &middot; Score IA: ${a.relevance_score}` : ''}
                    ${a.human_score != null ? ` &middot; Score Humano: ${a.human_score}` : ''}
                    ${a.human_feedback ? ` &middot; Feedback: ${a.human_feedback === 'good' ? '👍' : '👎'}` : ''}
                </div>
                <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px;padding:10px;background:var(--tv-gray-very-light);border-radius:8px">
                    <div>
                        <label style="font-size:12px;font-weight:600">Score Humano</label>
                        <div style="display:flex;gap:6px;margin-top:4px">
                            <input type="number" min="0" max="10" step="0.5" value="${a.human_score ?? a.relevance_score ?? ''}" class="input" style="width:70px;padding:6px 8px;font-size:13px" id="detail-hscore-${a.id}" placeholder="0-10">
                            <button class="btn btn-sm" onclick="saveHumanScore(${a.id}); document.getElementById('hscore-${a.id}')&&(document.getElementById('hscore-${a.id}').value=document.getElementById('detail-hscore-${a.id}').value)">Salvar</button>
                        </div>
                    </div>
                    <div>
                        <label style="font-size:12px;font-weight:600">Feedback</label>
                        <div style="display:flex;gap:6px;margin-top:4px">
                            <button class="btn btn-sm ${a.human_feedback === 'good' ? 'btn-success' : ''}" onclick="saveHumanFeedback(${a.id},'good',this)">👍 Bom</button>
                            <button class="btn btn-sm ${a.human_feedback === 'bad' ? 'btn-danger' : ''}" onclick="saveHumanFeedback(${a.id},'bad',this)">👎 Ruim</button>
                        </div>
                    </div>
                </div>
                ${a.executive_summary ? `<div style="background:var(--tv-gray-light);padding:12px;border-radius:8px;margin-bottom:12px;font-size:13px"><strong>Resumo Executivo:</strong> ${esc(a.executive_summary)}</div>` : ''}
                <div style="font-size:13px;line-height:1.7">${esc(a.excerpt || a.content || '').slice(0, 800)}</div>
                ${commercial}
                ${a.url ? `<div style="margin-top:12px"><a href="${esc(a.url)}" target="_blank" class="btn btn-sm">Abrir original</a></div>` : ''}
            `;

            const footer = `
                ${!a.is_published ? `<button class="btn btn-success" onclick="publishArticle(${a.id}); closeDetailPanel();">Publicar</button>` : `<button class="btn btn-warning" onclick="unpublishArticle(${a.id}); closeDetailPanel();">Despublicar</button>`}
                ${!a.manually_pinned ? `<button class="btn" onclick="pinArticle(${a.id}, true); closeDetailPanel();">Fixar</button>` : `<button class="btn" onclick="pinArticle(${a.id}, false); closeDetailPanel();">Desfixar</button>`}
                ${a.status !== 'rejected' ? `<button class="btn btn-danger" onclick="rejectArticle(${a.id}); closeDetailPanel();">Rejeitar</button>` : `<button class="btn" onclick="restoreArticle(${a.id}); closeDetailPanel();">Restaurar</button>`}
            `;

            openDetailPanel(a.title, body, footer);
        } catch (e) {
            alert('Erro ao carregar artigo: ' + e.message);
        }
    }

    async function publishArticle(id) {
        await sbFetch(`news_articles?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ is_published: true, status: 'approved' }) });
        renderNoticias(document.getElementById('content-body'));
    }

    async function unpublishArticle(id) {
        await sbFetch(`news_articles?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ is_published: false }) });
        renderNoticias(document.getElementById('content-body'));
    }

    async function pinArticle(id, pin) {
        await sbFetch(`news_articles?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ manually_pinned: pin }) });
        renderNoticias(document.getElementById('content-body'));
    }

    async function rejectArticle(id) {
        if (!confirm('Rejeitar este artigo?')) return;
        await sbFetch(`news_articles?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ status: 'rejected', is_published: false }) });
        renderNoticias(document.getElementById('content-body'));
    }

    async function restoreArticle(id) {
        await sbFetch(`news_articles?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ status: 'approved' }) });
        renderNoticias(document.getElementById('content-body'));
    }

    async function saveHumanScore(id) {
        const input = document.getElementById(`hscore-${id}`) || document.getElementById(`detail-hscore-${id}`);
        if (!input) return;
        const val = parseFloat(input.value);
        if (isNaN(val) || val < 0 || val > 10) { alert('Score deve ser entre 0 e 10'); return; }
        try {
            await sbFetch(`news_articles?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ human_score: val }) });
            input.style.borderColor = 'var(--tv-green)';
            setTimeout(() => { input.style.borderColor = ''; }, 1500);
        } catch (e) { alert('Erro ao salvar score: ' + e.message); }
    }

    async function saveHumanFeedback(id, feedback, btn) {
        try {

    async function loadFunilData() {
        STAGES.forEach(s => { const el = document.getElementById('col-' + s); if (el) el.innerHTML = ''; });
        try {
            const src = document.getElementById('funil-filter-source')?.value;
            let url = 'leads_funnel?select=*&order=created_at.asc';
            if (src) url += `&source=eq.${src}`;
            let rows = await sbFetch(url);

            if (document.getElementById('funil-filter-late')?.checked) {
                const seven = 7 * 24 * 60 * 60 * 1000;
                rows = rows.filter(r => !r.last_contact_at || (Date.now() - new Date(r.last_contact_at).getTime()) > seven);
            }

            rows.forEach(r => renderFunilCard(r));
            updateFunilCounts();
        } catch (e) {
            console.warn('Erro ao carregar funil:', e);
        }
    }

    function renderFunilCard(r) {
        const canEdit = window.authManager.hasPermission('editar_funil');
        const colId = 'col-' + (STAGES.includes(r.stage) ? r.stage : 'entrada');
        const diff = r.last_contact_at ? (Date.now() - new Date(r.last_contact_at).getTime()) : 0;
        const days = r.last_contact_at ? Math.floor(diff / 86400000) : '—';
        const late = typeof days === 'number' && days > 7;
        const phone = String(r.phone || '').replace(/\D/g, '');
        const intl = phone.length <= 11 ? '55' + phone : phone;
        const waUrl = `https://wa.me/${intl}?text=${encodeURIComponent('ola ' + (r.name||'').split(/\s+/)[0] + ' e aqui e do TEM VENDA, ')}`;

        const el = document.createElement('div');
        el.className = 'kanban-card';
        el.draggable = canEdit && r.stage !== 'fechado';
        el.dataset.id = r.id;
        el.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="this.parentElement.classList.toggle('expanded')">
                <div>
                    <div class="kanban-card-name">${esc(r.name||'-')}</div>
                    <div class="kanban-card-sub">${esc(r.phone||'-')}</div>
                </div>
                ${late ? '<span class="badge badge-red">Atrasado</span>' : ''}
            </div>
            <div class="kanban-card-details">
                <div class="muted">${esc(r.email||'-')}</div>
                <div class="muted">Origem: <span class="badge badge-green">${esc(r.source||'-')}</span></div>
                <div class="muted">Dias sem contato: <strong>${days}</strong></div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
                    ${r.stage !== 'fechado' ? `<input type="number" min="0" max="10" value="${r.score??0}" style="width:60px;padding:3px 6px;border:1px solid var(--tv-gray-border);border-radius:4px;font-size:12px" onchange="updateFunilScore('${r.id}', this.value)" title="Aquecimento">` : ''}
                    <a class="btn btn-sm" href="${waUrl}" target="_blank" title="WhatsApp">WhatsApp</a>
