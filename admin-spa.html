    function updateFunilCounts() {
        const counts = {};
        STAGES.forEach(s => {
            const c = document.getElementById('col-' + s)?.children.length || 0;
            counts[s] = c;
            const el = document.getElementById('count-' + s);
            if (el) el.textContent = c;
        });
        const total = Math.max(1, Object.values(counts).reduce((a, b) => a + b, 0));
        STAGES.forEach(s => {
            const bar = document.getElementById('bar-' + s);
            if (bar) bar.style.height = (4 + 110 * counts[s] / total) + 'px';
        });
    }

    function enableFunilDnD() {
        document.querySelectorAll('.kanban-col-body').forEach(body => {
            body.addEventListener('dragover', e => { e.preventDefault(); body.style.background = '#f6fff2'; });
            body.addEventListener('dragleave', () => body.style.background = '');
            body.addEventListener('drop', async e => {
                e.preventDefault();
                body.style.background = '';
                const id = e.dataTransfer.getData('text/plain');
                if (!id) return;
                const card = document.querySelector(`[data-id="${id}"]`);
                if (card) body.appendChild(card);
                updateFunilCounts();
                const stage = body.id.replace('col-', '');
                try { await sbFetch(`leads_funnel?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ stage, last_contact_at: new Date().toISOString() }) }); } catch (e) { console.warn(e); }
            });
        });
    }

        const imageUrls = {};

            }
        });

    function handleImgUpload(key) {
        const file = document.getElementById('imgfile-' + key)?.files[0];
        if (!file || !file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const maxW = 800;
                let w = img.width, h = img.height;
                if (w > maxW) { h = h * maxW / w; w = maxW; }
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                const data = canvas.toDataURL('image/jpeg', 0.85);
                const prev = document.getElementById('imgprev-' + key);
                if (prev) prev.innerHTML = `<img src="${data}">`;
                prev.dataset.pending = data;
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);

    // LP field helper
    function lpField(id, label, value, textarea) {
        // For textareas with HTML content, strip tags for editing but preserve readable text
        const displayVal = textarea ? stripHtmlToText(value) : esc(value);
        return `<div class="lp-field"><label>${esc(label)}</label>${textarea
            ? `<textarea id="${id}">${displayVal}</textarea>`
            : `<input id="${id}" value="${esc(value)}">`
        }</div>`;
    }

    function stripHtmlToText(html) {
        if (!html) return '';
        // Convert <br> and </p><p> to newlines, <strong> to text, then strip remaining tags
        return html
            .replace(/<br\s*\/?[^>]*>/gi, '\n')
            .replace(/<\/p>\s*<p[^>]*>/gi, '\n\n')
            .replace(/<\/li>\s*<li[^>]*>/gi, '\n')
            .replace(/<\/(ul|ol)>/gi, '\n')
            .replace(/<[^>]+>/g, '')
            .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'")
            .trim();
    }

    const GH_OWNER = 'cklaumann-maker';
    const GH_REPO  = 'site-temvenda';

    function getGhToken() { return localStorage.getItem('gh_pat') || ''; }
    function setGhToken(t) { localStorage.setItem('gh_pat', t.trim()); }

    async function ghApi(path, opts = {}) {
        const token = getGhToken();
        if (!token) throw new Error('Token GitHub nao configurado');
        const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}${path}`, {
            ...opts,
            headers: {
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
                ...(opts.headers || {})
            }
        });
        if (res.status === 204) return null;
        if (!res.ok) {
            const txt = await res.text();
            throw new Error(`GitHub API ${res.status}: ${txt.slice(0,200)}`);
        }
        return res.json();
    }

    async function loadWorkflows() {
        const data = await ghApi('/actions/workflows');
        const workflows = (data.workflows || []).filter(w => w.state !== 'deleted');

        // fetch last run for each
        const runsData = await ghApi('/actions/runs?per_page=30&status=completed');
        const allRuns = runsData.workflow_runs || [];

        // also fetch in-progress runs
        let activeRuns = [];
        try {
            const activeData = await ghApi('/actions/runs?per_page=10&status=in_progress');
            activeRuns = activeData.workflow_runs || [];
        } catch(e) {}

        const combined = [...activeRuns, ...allRuns];

        return workflows.map(w => {
            const runs = combined.filter(r => r.workflow_id === w.id).sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
            const lastRun = runs[0] || null;
            return { ...w, lastRun, hasDispatch: w.path ? true : false };
        });
    }

    function workflowStatusBadge(run) {
        if (!run) return '<span class="auto-status pending">Sem execucoes</span>';
        const s = run.status === 'in_progress' || run.status === 'queued' ? 'running'
                : run.conclusion === 'success' ? 'success'
                : run.conclusion === 'failure' ? 'failure'
                : 'pending';
        const labels = { running: 'Em execucao', success: 'Sucesso', failure: 'Falhou', pending: run.conclusion || 'Pendente' };
        return `<span class="auto-status ${s}">${labels[s]}</span>`;
    }

    function workflowScheduleDesc(w) {
        // Extract cron info from known workflows
        const name = (w.name || '').toLowerCase();
        if (name.includes('6h') || name.includes('6am')) return 'Diario as 6h (BRT)';
        return w.state === 'active' ? 'Ativo' : 'Desativado';
    }

    function timeAgo(dateStr) {
        if (!dateStr) return '-';
        const diff = Date.now() - new Date(dateStr).getTime();
        const mins = Math.floor(diff / 60000);
        if (mins < 1) return 'agora';
        if (mins < 60) return `${mins}min atras`;
        const hrs = Math.floor(mins / 60);
        if (hrs < 24) return `${hrs}h atras`;
        const days = Math.floor(hrs / 24);
        return `${days}d atras`;
    }

    async function triggerWorkflow(workflowId, btn) {
        btn.disabled = true;
        btn.classList.add('triggering');
        btn.textContent = 'Disparando...';
        try {
            await ghApi(`/actions/workflows/${workflowId}/dispatches`, {
                method: 'POST',
                body: JSON.stringify({ ref: 'main' })
            });
            btn.textContent = 'Disparado!';
            btn.style.background = '#2e7d32';
            btn.style.borderColor = '#2e7d32';
            setTimeout(() => {
                btn.disabled = false;
                btn.classList.remove('triggering');
                btn.textContent = 'Disparar';
                btn.style.background = '';
                btn.style.borderColor = '';
            }, 5000);
        } catch (e) {
            btn.textContent = 'Erro!';
            btn.style.background = '#d32f2f';
            btn.style.borderColor = '#d32f2f';
            alert('Erro ao disparar: ' + e.message);
            setTimeout(() => {
                btn.disabled = false;
                btn.classList.remove('triggering');
                btn.textContent = 'Disparar';
                btn.style.background = '';
                btn.style.borderColor = '';
            }, 3000);
        }
    }

    async function renderAutoSection() {

                    <h3 style="margin-bottom:8px">Configurar acesso ao GitHub</h3>

                    <div style="display:flex;gap:8px;justify-content:center;max-width:500px;margin:0 auto">

                    <span class="muted">Token GitHub:</span>

    async function renderHistoricoSection() {
        const el = document.getElementById('ferr-historico');
        if (!el) return;
        el.innerHTML = '<div style="text-align:center;padding:32px"><div class="muted">Carregando historico...</div></div>';

        try {
            const runs = await sbFetch('automation_runs?select=*&order=started_at.desc&limit=20');

            if (!runs || runs.length === 0) {
                el.innerHTML = `
                    <div class="empty-state" style="padding:40px;text-align:center">
                        <div style="font-size:36px;margin-bottom:12px">&#128203;</div>
                        <h3>Nenhuma execucao registrada</h3>
                        <p class="muted">As execucoes aparecerão aqui apos a proxima coleta automatica.</p>
                        <p class="muted" style="font-size:11px;margin-top:8px">A automacao roda diariamente as 6h (BRT) ou pode ser disparada manualmente na aba Automacoes.</p>
                    </div>
                `;
                return;
            }

            let html = `
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:20px">
                    <div class="card" style="padding:14px;text-align:center">
                        <div style="font-size:22px;font-weight:700">${runs.length}</div>
                        <div class="muted" style="font-size:11px">Execucoes</div>
                    </div>
                    <div class="card" style="padding:14px;text-align:center">
                        <div style="font-size:22px;font-weight:700;color:#2e7d32">${runs.filter(r=>r.status==='success').length}</div>
                        <div class="muted" style="font-size:11px">Sucesso</div>
                    </div>
                    <div class="card" style="padding:14px;text-align:center">
                        <div style="font-size:22px;font-weight:700;color:#d32f2f">${runs.filter(r=>r.status==='error').length}</div>
                        <div class="muted" style="font-size:11px">Erros</div>
                    </div>
                    <div class="card" style="padding:14px;text-align:center">
                        <div style="font-size:22px;font-weight:700">${runs.reduce((s,r)=>s+(r.articles_collected||0),0)}</div>
                        <div class="muted" style="font-size:11px">Total Coletados</div>
                    </div>
                    <div class="card" style="padding:14px;text-align:center">
                        <div style="font-size:22px;font-weight:700">${runs.reduce((s,r)=>s+(r.articles_promoted||0),0)}</div>
                        <div class="muted" style="font-size:11px">Total Promovidos</div>
                    </div>
                </div>
            `;

            html += '<div style="display:flex;flex-direction:column;gap:12px">';

            for (const run of runs) {
                const started = new Date(run.started_at);
                const finished = run.finished_at ? new Date(run.finished_at) : null;
                const duration = finished ? Math.round((finished - started) / 1000) : null;
                const statusCls = run.status === 'success' ? 'success' : run.status === 'error' ? 'failure' : 'running';
                const statusLabel = run.status === 'success' ? 'Sucesso' : run.status === 'error' ? 'Erro' : 'Em execucao';

                let details = {};
                try { details = typeof run.details === 'string' ? JSON.parse(run.details) : (run.details || {}); } catch(e) {}

                const collectedTitles = details.collected_titles || [];
                const promotionScores = (details.promotion || {}).scores || [];
                const publishedTitles = (details.rotation || {}).published_titles || [];
                const promotionIA = (details.promotion || {}).analyzed_ia || 0;
                const promotionBasic = (details.promotion || {}).analyzed_basic || 0;
                const rotatedOut = (details.rotation || {}).rotated_out || 0;

                html += `
                    <div class="auto-card" id="run-card-${run.id}">
                        <div class="auto-card-header" style="cursor:pointer" onclick="toggleRunDetail(${run.id})">
                            <div class="auto-card-info">
                                <div class="auto-card-name">
                                    ${started.toLocaleDateString('pt-BR')} as ${started.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'})}
                                </div>
                                <div class="auto-card-desc">
                                    ${run.articles_collected||0} coletados &middot;
                                    ${run.articles_promoted||0} promovidos &middot;
                                    ${run.total_published||0} publicados
                                    ${run.avg_score ? ' &middot; Score medio: ' + Number(run.avg_score).toFixed(1) : ''}
                                </div>
                            </div>
                            <div style="display:flex;align-items:center;gap:8px">
                                <span class="auto-status ${statusCls}">${statusLabel}</span>
                                ${duration !== null ? `<span class="muted" style="font-size:11px">${duration}s</span>` : ''}
                                <span class="expand-toggle" style="font-size:14px">&#9660;</span>
                            </div>
                        </div>

                        <div class="article-expand" id="run-detail-${run.id}">
                            ${run.error_message ? `<div style="background:rgba(211,47,47,.08);border-radius:6px;padding:10px;margin-bottom:12px;color:#d32f2f;font-size:12px"><strong>Erro:</strong> ${esc(run.error_message)}</div>` : ''}

                            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">
                                <!-- Coleta -->
                                <div>
                                    <div class="article-expand-label">Coleta</div>
                                    <div style="font-size:12px;line-height:1.8">
                                        <div>Fontes processadas: <strong>${run.sources_processed||0}</strong></div>
                                        <div>Artigos novos coletados: <strong>${run.articles_collected||0}</strong></div>
                                        ${collectedTitles.length ? collectedTitles.map(t => `
                                            <div style="margin-left:8px;color:var(--tv-gray-medium);font-size:11px">
                                                &#8226; ${esc(t.title)} <span style="color:#1565c0">(${t.score})</span> <span class="muted">${esc(t.source||'')}</span>
                                            </div>
                                        `).join('') : ''}
                                    </div>
                                </div>

                                <!-- Promocao -->
                                <div>
                                    <div class="article-expand-label">Promocao (Scores)</div>
                                    <div style="font-size:12px;line-height:1.8">
                                        <div>Analisados com IA: <strong>${promotionIA}</strong></div>
                                        <div>Score basico (antigos): <strong>${promotionBasic}</strong></div>
                                        ${promotionScores.length ? promotionScores.map(s => `
                                            <div style="margin-left:8px;color:var(--tv-gray-medium);font-size:11px">
                                                &#8226; ${esc(s.title)} → <strong style="color:${s.score >= 7 ? '#2e7d32' : s.score >= 5 ? '#f57c00' : '#d32f2f'}">${s.score}</strong>
                                            </div>
                                        `).join('') : ''}
                                    </div>
                                </div>

                                <!-- Rotacao -->
                                <div>
                                    <div class="article-expand-label">Publicacao / Rotacao</div>
                                    <div style="font-size:12px;line-height:1.8">
                                        <div>Total no ar: <strong>${run.total_published||0}</strong></div>
                                        <div>Removidos (rotacao): <strong>${rotatedOut}</strong></div>
                                        <div>Fixados manualmente: <strong>${(details.rotation||{}).pinned||0}</strong></div>
                                        ${publishedTitles.length ? `
                                            <div style="margin-top:6px;font-size:11px;color:var(--tv-gray-medium)">No ar agora:</div>
                                            ${publishedTitles.map((t,i) => `
                                                <div style="margin-left:8px;color:var(--tv-gray-medium);font-size:11px">
                                                    ${i===0?'&#11088;':i<=3?'&#9733;':'&#8226;'} ${esc(t.title)}
                                                    <strong style="color:#1565c0">${t.score||'-'}</strong>
                                                    ${t.score_source==='human'?'<span style="background:#e8f5e9;color:#2e7d32;padding:1px 5px;border-radius:3px;font-size:10px">editor</span>':''}
                                                    ${t.human_feedback==='bom'?'<span style="color:#2e7d32">&#128077;</span>':t.human_feedback==='ruim'?'<span style="color:#d32f2f">&#128078;</span>':''}
                                                </div>
                                            `).join('')}
                                        ` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            html += '</div>';
            el.innerHTML = html;

        } catch (e) {
            el.innerHTML = `<div class="empty-state"><h3>Erro ao carregar historico</h3><p class="muted">${esc(e.message)}</p></div>`;
        }
    }

    function toggleRunDetail(id) {
        const card = document.getElementById(`run-card-${id}`);
        const detail = document.getElementById(`run-detail-${id}`);
        if (!card || !detail) return;
        const isOpen = detail.style.display === 'block';
        detail.style.display = isOpen ? 'none' : 'block';
        card.querySelector('.expand-toggle').innerHTML = isOpen ? '&#9660;' : '&#9650;';
    }

    function saveGhToken() {
        const input = document.getElementById('gh-token-input');
        const val = (input?.value || '').trim();
        if (!val) { alert('Insira um token valido'); return; }
        setGhToken(val);
        renderAutoSection();
    }

    function removeGhToken() {
        localStorage.removeItem('gh_pat');
        renderAutoSection();
    }

        try {

                await sbFetch(`news_settings?key=eq.${u.key}`, { method: 'PATCH', body: JSON.stringify({ value: u.value }) });
