<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Google Analytics 4 -->
    <script src="/ga4-config.js"></script>

    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="16x16">
    <link rel="apple-touch-icon" href="/favicon-32.png" sizes="180x180">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área Administrativa - TEM VENDA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="/supabase-config.js"></script>
    <script src="/auth-manager.js"></script>
    <style>
        :root {
            --tv-white: #FFFFFF;
            --tv-black: #000000;
            --tv-gray-light: #FAFAFA;
            --tv-gray-medium: #999999;
            --tv-gray-dark: #333333;
            --tv-gray-border: #EEEEEE;
            --tv-green: #5ee100;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--tv-white);
            color: var(--tv-black);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 15px;
            line-height: 1.5;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .admin-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 32px;
        }

        /* Header Minimalista */
        .admin-header {
            margin-bottom: 48px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--tv-gray-border);
        }

        .admin-header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 24px;
        }

        .admin-title {
            font-size: 20px;
            font-weight: 500;
            color: var(--tv-black);
            letter-spacing: -0.3px;
        }

        .admin-nav {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .admin-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--tv-gray-medium);
            text-decoration: none;
            font-weight: 400;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .admin-link:hover {
            color: var(--tv-black);
            background: var(--tv-gray-light);
        }

        /* Sistema de Abas Minimalista */
        .tabs-container {
            background: var(--tv-white);
            border: 1px solid var(--tv-gray-border);
            border-radius: 8px;
            overflow: hidden;
        }

        .tabs-header {
            display: flex;
            background: var(--tv-gray-light);
            border-bottom: 1px solid var(--tv-gray-border);
            overflow-x: auto;
        }

        .tab-button {
            padding: 14px 20px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            font-size: 14px;
            font-weight: 400;
            color: var(--tv-gray-medium);
            transition: all 0.2s ease;
            white-space: nowrap;
            position: relative;
        }

        .tab-button:hover {
            color: var(--tv-black);
            background: rgba(0, 0, 0, 0.02);
        }

        .tab-button.active {
            color: var(--tv-black);
            border-bottom-color: var(--tv-black);
            background: var(--tv-white);
            font-weight: 500;
        }

        .tab-content {
            display: none;
            padding: 0;
            min-height: 400px;
        }

        .tab-content.active {
            display: block;
        }

        .iframe-container {
            width: 100%;
            height: calc(100vh - 280px);
            min-height: 600px;
            border: none;
            overflow: hidden;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Voltar Minimalista */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--tv-gray-medium);
            text-decoration: none;
            font-weight: 400;
            font-size: 14px;
            margin-bottom: 32px;
            transition: all 0.2s ease;
        }

        .back-link:hover {
            color: var(--tv-black);
        }

        /* Notificações Minimalistas */
        .notification-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 360px;
        }

        .notification {
            background: var(--tv-white);
            border: 1px solid var(--tv-gray-border);
            border-radius: 6px;
            padding: 12px 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            animation: slideInRight 0.2s ease-out;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .notification:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .notification-icon {
            width: 20px;
            height: 20px;
            color: var(--tv-green);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .notification-content {
            flex: 1;
        }

        .notification-title {
            font-weight: 500;
            font-size: 14px;
            color: var(--tv-black);
            margin-bottom: 4px;
        }

        .notification-message {
            font-size: 13px;
            color: var(--tv-gray-medium);
            line-height: 1.4;
        }

        .notification-source {
            display: inline-block;
            color: var(--tv-gray-medium);
            font-size: 11px;
            font-weight: 400;
            margin-top: 6px;
        }

        .notification-close {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 20px;
            height: 20px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 16px;
            color: var(--tv-gray-medium);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: color 0.2s ease;
            line-height: 1;
        }

        .notification-close:hover {
            color: var(--tv-black);
        }

        /* Aba Ferramentas */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            padding: 24px;
        }

        .tool-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            border: 1px solid var(--tv-gray-border);
            border-radius: 6px;
            text-decoration: none;
            color: var(--tv-black);
            font-size: 14px;
            font-weight: 400;
            transition: all 0.2s ease;
        }

        .tool-link:hover {
            border-color: var(--tv-black);
            background: var(--tv-gray-light);
        }

        @media (max-width: 768px) {
            .admin-container {
                padding: 20px;
            }

            .admin-title {
                font-size: 18px;
            }

            .tabs-header {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            .tab-button {
                padding: 12px 16px;
                font-size: 13px;
            }

            .iframe-container {
                height: calc(100vh - 240px);
                min-height: 500px;
            }

            .notification-container {
                top: 16px;
                right: 16px;
                max-width: calc(100% - 32px);
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <a href="/" class="back-link">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Voltar
        </a>

        <div class="admin-header">
            <div class="admin-header-content">
                <h1 class="admin-title">Área Administrativa</h1>
                <div class="admin-nav">
                    <a href="/central-inteligencia.html" class="admin-link">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
                        </svg>
                        Notícias Públicas
                    </a>
                    <a href="#" onclick="logout(); return false;" class="admin-link">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
                        </svg>
                        Sair
                    </a>
                </div>
            </div>
        </div>

        <div class="tabs-container">
            <div class="tabs-header">
                <button class="tab-button active" data-tab="funil" id="tabFunil" style="display: none;">
                    Funil de Vendas
                </button>
                <button class="tab-button" data-tab="noticias">
                    Notícias
                </button>
                <button class="tab-button" data-tab="estatisticas">
                    Estatísticas
                </button>
                <button class="tab-button" data-tab="automacao">
                    Automação
                </button>
                <button class="tab-button" data-tab="ferramentas">
                    Ferramentas
                </button>
                <button class="tab-button" data-tab="leads" id="tabLeads" style="display: none;">
                    Leads
                </button>
                <button class="tab-button" data-tab="usuarios" id="tabUsuarios" style="display: none;">
                    Usuários
                </button>
            </div>

            <div class="tabs-content">
                <!-- Aba Funil -->
                <div class="tab-content active" id="content-funil">
                    <div class="iframe-container">
                        <iframe id="iframe-funil" src="/funil.html"></iframe>
                    </div>
                </div>

                <!-- Aba Notícias -->
                <div class="tab-content" id="content-noticias">
                    <div class="iframe-container">
                        <iframe id="iframe-noticias" src="/app/admin-panel.html?v=2"></iframe>
                    </div>
                </div>

                <!-- Aba Estatísticas -->
                <div class="tab-content" id="content-estatisticas">
                    <div class="iframe-container">
                        <iframe id="iframe-estatisticas" src="/stats.html"></iframe>
                    </div>
                </div>

                <!-- Aba Automação -->
                <div class="tab-content" id="content-automacao">
                    <div class="iframe-container">
                        <iframe id="iframe-automacao" src="/app/automation-dashboard.html"></iframe>
                    </div>
                </div>

                <!-- Aba Ferramentas -->
                <div class="tab-content" id="content-ferramentas">
                    <div class="tools-grid">
                        <a class="tool-link" href="/instagram" target="_blank">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
                                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
                                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
                            </svg>
                            Captura Instagram
                        </a>
                        <a class="tool-link" href="/formacao-lp.html" target="_blank">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/>
                                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
                            </svg>
                            Formação de Líderes
                        </a>
                    </div>
                </div>

                <!-- Aba Usuários -->
                <div class="tab-content" id="content-usuarios">
                    <div class="iframe-container">
                        <iframe id="iframe-usuarios" src="/usuarios.html"></iframe>
                    </div>
                </div>

                <!-- Aba Leads -->
                <div class="tab-content" id="content-leads">
                    <div class="iframe-container">
                        <iframe id="iframe-leads" src="/leads.html"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Container de Notificações -->
    <div class="notification-container" id="notificationContainer"></div>

    <script>
        // Verificar autenticação
        if (!window.authManager || !window.authManager.checkAuth()) {
            window.location.href = '/entrar.html';
        }

        // Verificar permissões
        document.addEventListener('DOMContentLoaded', function() {
            const user = window.authManager.getCurrentUser();
            
            // Mostrar aba de usuários apenas se tiver permissão
            if (window.authManager.hasPermission('manage_users')) {
                document.getElementById('tabUsuarios').style.display = 'block';
            }
            // Mostrar abas de leads/funil para quem pode gerenciar stats
            if (window.authManager.hasPermission('manage_stats')) {
                document.getElementById('tabLeads').style.display = 'block';
                document.getElementById('tabFunil').style.display = 'block';
                // Ativar Funil como padrão se tiver permissão
                switchToTab('funil');
            }

            // Esconder abas baseadas em permissões
            if (!window.authManager.hasPermission('manage_news')) {
                const tabNoticias = document.querySelector('[data-tab="noticias"]');
                if (tabNoticias) {
                    tabNoticias.style.display = 'none';
                    if (tabNoticias.classList.contains('active')) {
                        // Se não tiver permissão para stats, vai para funil ou estatísticas
                        if (window.authManager.hasPermission('manage_stats')) {
                            switchToTab('funil');
                        } else {
                            switchToTab('estatisticas');
                        }
                    }
                }
            }

            if (!window.authManager.hasPermission('manage_stats')) {
                const tabStats = document.querySelector('[data-tab="estatisticas"]');
                if (tabStats) {
                    tabStats.style.display = 'none';
                    if (tabStats.classList.contains('active')) {
                        switchToTab('noticias');
                    }
                }
            }
        });

        // Sistema de abas
        function switchToTab(tabName) {
            // Desativar todas as abas
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });

            // Ativar aba selecionada
            const button = document.querySelector(`[data-tab="${tabName}"]`);
            const content = document.getElementById(`content-${tabName}`);

            if (button && content) {
                button.classList.add('active');
                content.classList.add('active');
            }
        }

        // Event listeners para botões de aba
        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', function() {
                const tabName = this.getAttribute('data-tab');
                switchToTab(tabName);
            });
        });

        // Função de logout
        function logout() {
            if (confirm('Deseja realmente sair?')) {
                window.authManager.logout();
            }
        }

        // Recarregar iframes quando mudar de aba
        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', function() {
                const tabName = this.getAttribute('data-tab');
                const iframe = document.getElementById(`iframe-${tabName}`);
                if (iframe) {
                    // Forçar reload do iframe de notícias para garantir versão atualizada
                    if (tabName === 'noticias') {
                        const currentSrc = iframe.src.split('?')[0];
                        iframe.src = currentSrc + '?v=' + Date.now();
                    } else {
                        // Recarregar apenas se não foi carregado ainda
                        if (!iframe.dataset.loaded) {
                            iframe.dataset.loaded = 'true';
                        }
                        // Recarregar on-demand quando voltar para aba
                        iframe.contentWindow && iframe.contentWindow.location && (iframe.contentWindow.location.reload());
                    }
                }
            });
        });

        // Sistema de Notificações de Novos Leads
        let supabaseClient = null;
        let leadSubscription = null;

        // Inicializar cliente Supabase e monitorar novos leads
        async function initLeadNotifications() {
            if (!window.SUPABASE_CONFIG) {
                console.warn('Supabase config não encontrada');
                return;
            }

            try {
                if (typeof supabase === 'undefined') {
                    console.warn('Supabase não disponível. Carregue o script do Supabase.');
                    return;
                }

                const { createClient } = supabase;
                supabaseClient = createClient(
                    window.SUPABASE_CONFIG.url,
                    window.SUPABASE_CONFIG.anonKey
                );

                // Monitorar novos leads usando Realtime
                leadSubscription = supabaseClient
                    .channel('leads_funnel_changes')
                    .on('postgres_changes', {
                        event: 'INSERT',
                        schema: 'public',
                        table: 'leads_funnel'
                    }, (payload) => {
                        const newLead = payload.new;
                        showNewLeadNotification(newLead);
                    })
                    .subscribe();

                console.log('✅ Notificações de leads ativas');
            } catch (error) {
                console.error('Erro ao inicializar notificações:', error);
            }
        }

        // Mostrar notificação de novo lead
        function showNewLeadNotification(lead) {
            const container = document.getElementById('notificationContainer');
            if (!container) return;

            const sourceLabels = {
                'instagram': 'Instagram',
                'diagnostico': 'Diagnóstico',
                'formacao': 'Formação de Líderes',
                'consultoria': 'Consultoria',
                'palestras': 'Palestras',
                'treinamento': 'Treinamento'
            };

            const sourceLabel = sourceLabels[lead.source] || lead.source || 'Site';
            const leadName = lead.name || 'Lead sem nome';
            const leadPhone = lead.phone || 'Sem telefone';

            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.innerHTML = `
                <div class="notification-icon">🔔</div>
                <div class="notification-content">
                    <div class="notification-title">Novo Lead</div>
                    <div class="notification-message">
                        ${escapeHtml(leadName)}<br>
                        ${escapeHtml(leadPhone)}
                    </div>
                    <span class="notification-source">${escapeHtml(sourceLabel)}</span>
                </div>
                <button class="notification-close" onclick="this.parentElement.remove()">×</button>
            `;

            // Click na notificação leva para o funil
            notification.addEventListener('click', function(e) {
                if (!e.target.classList.contains('notification-close')) {
                    switchToTab('funil');
                    setTimeout(() => {
                        const funilIframe = document.getElementById('iframe-funil');
                        if (funilIframe && funilIframe.contentWindow) {
                            funilIframe.contentWindow.location.reload();
                        }
                    }, 300);
                    notification.remove();
                }
            });

            container.appendChild(notification);

            // Remover automaticamente após 8 segundos
            setTimeout(() => {
                if (notification.parentElement) {
                    notification.style.animation = 'slideInRight 0.2s ease-out reverse';
                    setTimeout(() => notification.remove(), 200);
                }
            }, 8000);
        }

        // Função auxiliar para escape HTML
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Inicializar notificações quando a página carregar
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                initLeadNotifications();
            }, 1000);
        });

        // Limpar subscription quando sair da página
        window.addEventListener('beforeunload', function() {
            if (leadSubscription) {
                leadSubscription.unsubscribe();
            }
        });
    </script>
</body>
</html>
