<style>

            --tv-white: #FFFFFF;
            --tv-black: #000000;

            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        /* Tabs de Status */
        .status-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            background: var(--tv-white);
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .status-tab {
            padding: 12px 24px;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--tv-gray-medium);
            position: relative;
        }

        .status-tab.active {
            background: linear-gradient(135deg, var(--tv-primary) 0%, var(--tv-primary-dark) 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .status-tab:hover:not(.active) {
            background: var(--tv-gray-light);
            color: var(--tv-black);
        }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(255,255,255,0.3);
            border-radius: 12px;
            font-size: 11px;
            margin-left: 8px;
            font-weight: 700;
        }

        /* Grid de Campanhas */
        .campaigns-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .campaign-card {
            background: var(--tv-white);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);

<body>

    <!-- Modal de Cadastro -->
    <div class="modal-overlay" id="campaignModal">

                <h2 class="modal-title">Nova Campanha</h2>
                <button class="modal-close" onclick="closeCampaignModal()">×</button>
            </div>
            <form id="campaignForm" onsubmit="saveCampaign(event)">
                <div class="form-group">
                    <label class="form-label">Nome da Campanha *</label>
                    <input type="text" class="form-input" name="name" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Pixel ID do Meta *</label>
                    <input type="text" class="form-input" name="pixel_id" required placeholder="123456789012345">
                </div>

                    <div class="form-group">

                    </div>

                    <div class="form-group">
                        <label class="form-label">Orçamento (R$)</label>
                        <input type="number" step="0.01" class="form-input" name="budget" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Objetivo</label>
                        <input type="text" class="form-input" name="objective" placeholder="Ex: Captação de leads">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Público-Alvo</label>
                    <input type="text" class="form-input" name="target_audience" placeholder="Descreva o público-alvo">
                </div>
                <div class="form-group">
                    <label class="form-label">Status *</label>
                    <select class="form-input" name="status" required>
                        <option value="active">Ativa</option>
                        <option value="paused">Pausada</option>
                        <option value="finished">Finalizada</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-cancel" onclick="closeCampaignModal()">Cancelar</button>
                    <button type="submit" class="btn btn-submit">Salvar Campanha</button>
                </div>
            </form>

    <script>
        let campaigns = [];
        let allCampaignEvents = [];
        let currentStatusFilter = 'active';
        let currentCampaignId = null;
        let availableColumns = [
            { key: 'created_at', label: 'Data/Hora' },
            { key: 'event_name', label: 'Evento' },
            { key: 'user_name', label: 'Nome' },
            { key: 'user_email', label: 'E-mail' },
            { key: 'user_phone', label: 'Telefone' },
            { key: 'event_source', label: 'Fonte' },
            { key: 'page_url', label: 'URL da Página' },
            { key: 'pdf_downloaded', label: 'PDF Baixado' },
            { key: 'lead_created', label: 'Lead Criado' },
            { key: 'pixel_id', label: 'Pixel ID' },
            { key: 'event_id', label: 'ID do Evento' }
        ];
        let selectedColumns = availableColumns.map(c => c.key);

        // Carregar campanhas
        async function loadCampaigns() {
            try {
                const supabaseUrl = window.SUPABASE_CONFIG.url;
                const supabaseKey = window.SUPABASE_CONFIG.serviceKey || window.SUPABASE_CONFIG.anonKey;

                const response = await fetch(
                    `${supabaseUrl}/rest/v1/campaigns?select=*&order=created_at.desc`,
                    {
                        headers: {
                            'apikey': supabaseKey,
                            'Authorization': `Bearer ${supabaseKey}`,
                            'Content-Type': 'application/json'
                        }
                    }
                );

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                campaigns = await response.json();
                renderCampaigns();
                updateStatusCounts();
            } catch (error) {
                console.error('Erro ao carregar campanhas:', error);
                document.getElementById('campaignsContainer').innerHTML = 
                    `<div class="error">Erro ao carregar campanhas: ${error.message}</div>`;
            }
        }

        // Renderizar campanhas
        function renderCampaigns() {
            const container = document.getElementById('campaignsContainer');
            const filtered = campaigns.filter(c => c.status === currentStatusFilter);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>Nenhuma campanha ${getStatusLabel(currentStatusFilter)} encontrada.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(campaign => `
                <div class="campaign-card">
                    <div class="campaign-header">
                        <div>
                            <div class="campaign-name">${escapeHtml(campaign.name)}</div>
                            <div class="campaign-pixel">Pixel: ${campaign.pixel_id}</div>
                        </div>
                        <span class="campaign-status-badge status-${campaign.status}">${getStatusLabel(campaign.status)}</span>
                    </div>
                    ${campaign.description ? `<div class="campaign-description">${escapeHtml(campaign.description)}</div>` : ''}
                    <div class="campaign-meta">
                        ${campaign.start_date ? `<span>📅 Início: ${new Date(campaign.start_date).toLocaleDateString('pt-BR')}</span>` : ''}
                        ${campaign.end_date ? `<span>📅 Fim: ${new Date(campaign.end_date).toLocaleDateString('pt-BR')}</span>` : ''}
                        ${campaign.budget ? `<span>💰 R$ ${parseFloat(campaign.budget).toLocaleString('pt-BR', {minimumFractionDigits: 2})}</span>` : ''}
                    </div>
                    <div class="campaign-actions">
                        <button class="btn-sm primary" onclick="viewCampaignReport('${campaign.id}', '${campaign.pixel_id}')">Ver Relatório</button>
                        <button class="btn-sm" onclick="editCampaign('${campaign.id}')">Editar</button>
                        <button class="btn-sm" onclick="changeCampaignStatus('${campaign.id}', '${campaign.status === "active" ? "paused" : "active"}')">
                            ${campaign.status === 'active' ? 'Pausar' : 'Ativar'}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function getStatusLabel(status) {
            const labels = { active: 'ativa', paused: 'pausada', finished: 'finalizada' };
            return labels[status] || status;
        }

        function updateStatusCounts() {
            document.getElementById('count-active').textContent = campaigns.filter(c => c.status === 'active').length;
            document.getElementById('count-paused').textContent = campaigns.filter(c => c.status === 'paused').length;
            document.getElementById('count-finished').textContent = campaigns.filter(c => c.status === 'finished').length;
        }

        function filterByStatus(status) {
            currentStatusFilter = status;
            document.querySelectorAll('.status-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.status === status);
            });
            renderCampaigns();
        }

        // Modal de cadastro
        function openCampaignModal() {
            document.getElementById('campaignModal').classList.add('active');
            document.getElementById('campaignForm').reset();
            currentCampaignId = null;
            document.querySelector('.modal-title').textContent = 'Nova Campanha';
        }

        function closeCampaignModal() {
            document.getElementById('campaignModal').classList.remove('active');
        }

        async function saveCampaign(event) {
            event.preventDefault();
            console.log('💾 Salvando campanha...');
            console.log('📝 currentCampaignId:', currentCampaignId);
            
            const formData = new FormData(event.target);
            const data = Object.fromEntries(formData);
            
            console.log('📦 Dados do formulário:', data);

            try {
                const supabaseUrl = window.SUPABASE_CONFIG.url;
                const supabaseKey = window.SUPABASE_CONFIG.serviceKey || window.SUPABASE_CONFIG.anonKey;

                const url = currentCampaignId 
                    ? `${supabaseUrl}/rest/v1/campaigns?id=eq.${currentCampaignId}`
                    : `${supabaseUrl}/rest/v1/campaigns`;

                const method = currentCampaignId ? 'PATCH' : 'POST';
                
                console.log(`🔄 ${method} ${url}`);

                const response = await fetch(url, {
                    method,
                    headers: {
                        'apikey': supabaseKey,
                        'Authorization': `Bearer ${supabaseKey}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('❌ Erro na resposta:', response.status, errorText);
                    throw new Error(errorText || `HTTP ${response.status}`);
                }

                const result = await response.json();
                console.log('✅ Resposta do servidor:', result);

                // Limpar ID após salvar
                currentCampaignId = null;
                
                closeCampaignModal();
                loadCampaigns();
                alert(method === 'PATCH' ? 'Campanha atualizada com sucesso!' : 'Campanha salva com sucesso!');
            } catch (error) {
                console.error('❌ Erro ao salvar campanha:', error);
                alert(`Erro ao salvar campanha: ${error.message}`);
            }
        }

        async function editCampaign(id) {
            console.log('🔄 Editando campanha ID:', id);
            
            try {
                const supabaseUrl = window.SUPABASE_CONFIG.url;
                const supabaseKey = window.SUPABASE_CONFIG.serviceKey || window.SUPABASE_CONFIG.anonKey;

                // Buscar dados da campanha
                const response = await fetch(
                    `${supabaseUrl}/rest/v1/campaigns?id=eq.${id}&select=*`,
                    {
                        headers: {
                            'apikey': supabaseKey,
                            'Authorization': `Bearer ${supabaseKey}`,
                            'Content-Type': 'application/json'
                        }
                    }
                );

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                const data = await response.json();
                console.log('📦 Dados recebidos:', data);
                
                if (!data || data.length === 0) {
                    alert('Campanha não encontrada');
                    return;
                }

                const campaign = data[0];
                console.log('📋 Campanha encontrada:', campaign);
                
                // Definir ID da campanha atual para edição
                currentCampaignId = id;
                console.log('✅ currentCampaignId definido como:', currentCampaignId);

                // Função auxiliar para formatar data para input type="date" (YYYY-MM-DD)
                function formatDateForInput(dateString) {
                    if (!dateString) return '';
                    try {
                        const date = new Date(dateString);
                        if (isNaN(date.getTime())) return '';
                        const year = date.getFullYear();
                        const month = String(date.getMonth() + 1).padStart(2, '0');
                        const day = String(date.getDate()).padStart(2, '0');
                        return `${year}-${month}-${day}`;
                    } catch (e) {
                        console.warn('⚠️ Erro ao formatar data:', dateString, e);
                        return '';
                    }
                }

                // Buscar elementos do formulário
                const form = document.getElementById('campaignForm');
                if (!form) {
                    alert('Formulário não encontrado');
                    return;
                }

                // Preencher formulário com verificação de cada campo
                const nameInput = form.querySelector('[name="name"]');
                const pixelInput = form.querySelector('[name="pixel_id"]');
                const descriptionInput = form.querySelector('[name="description"]');
                const startDateInput = form.querySelector('[name="start_date"]');
                const endDateInput = form.querySelector('[name="end_date"]');
                const budgetInput = form.querySelector('[name="budget"]');
                const objectiveInput = form.querySelector('[name="objective"]');
                const targetAudienceInput = form.querySelector('[name="target_audience"]');
                const statusInput = form.querySelector('[name="status"]');

                if (nameInput) nameInput.value = campaign.name || '';
                if (pixelInput) pixelInput.value = campaign.pixel_id || '';
                if (descriptionInput) descriptionInput.value = campaign.description || '';
                if (startDateInput) startDateInput.value = formatDateForInput(campaign.start_date);
                if (endDateInput) endDateInput.value = formatDateForInput(campaign.end_date);
                if (budgetInput) budgetInput.value = campaign.budget || '';
                if (objectiveInput) objectiveInput.value = campaign.objective || '';
                if (targetAudienceInput) targetAudienceInput.value = campaign.target_audience || '';
                if (statusInput) statusInput.value = campaign.status || 'active';

                console.log('✅ Formulário preenchido com sucesso');

                // Atualizar título do modal
                const modalTitle = document.querySelector('.modal-title');
                if (modalTitle) {
                    modalTitle.textContent = 'Editar Campanha';
                }

                // Abrir modal
                const modal = document.getElementById('campaignModal');
                if (modal) {
                    modal.classList.add('active');
                    console.log('✅ Modal aberto');
                } else {
                    alert('Modal não encontrado');
                }
            } catch (error) {
                console.error('❌ Erro ao carregar campanha:', error);
                alert(`Erro ao carregar campanha: ${error.message}`);
            }
        }

        async function changeCampaignStatus(id, newStatus) {
            try {
                const supabaseUrl = window.SUPABASE_CONFIG.url;
                const supabaseKey = window.SUPABASE_CONFIG.serviceKey || window.SUPABASE_CONFIG.anonKey;

                const response = await fetch(
                    `${supabaseUrl}/rest/v1/campaigns?id=eq.${id}`,
                    {
                        method: 'PATCH',
                        headers: {
                            'apikey': supabaseKey,
                            'Authorization': `Bearer ${supabaseKey}`,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=representation'
                        },
                        body: JSON.stringify({ status: newStatus })
                    }
                );

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                loadCampaigns();
            } catch (error) {
                alert(`Erro ao alterar status: ${error.message}`);
            }
        }

        async function viewCampaignReport(campaignId, pixelId) {
            currentCampaignId = campaignId;
            document.getElementById('reportSection').style.display = 'block';
            document.getElementById('reportSection').scrollIntoView({ behavior: 'smooth' });

            try {
                const supabaseUrl = window.SUPABASE_CONFIG.url;
                const supabaseKey = window.SUPABASE_CONFIG.serviceKey || window.SUPABASE_CONFIG.anonKey;

                const response = await fetch(
                    `${supabaseUrl}/rest/v1/campaign_events?select=*&pixel_id=eq.${pixelId}&order=created_at.desc`,
                    {
                        headers: {
                            'apikey': supabaseKey,
                            'Authorization': `Bearer ${supabaseKey}`,
                            'Content-Type': 'application/json'
                        }
                    }
                );

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                allCampaignEvents = await response.json();
                renderColumnSelector();
                renderReportTable();
            } catch (error) {
                alert(`Erro ao carregar relatório: ${error.message}`);
            }
        }

        function renderColumnSelector() {
            const container = document.getElementById('columnCheckboxes');
            container.innerHTML = availableColumns.map(col => `
                <div class="checkbox-item">
                    <input type="checkbox" 
                           id="col-${col.key}" 
                           ${selectedColumns.includes(col.key) ? 'checked' : ''}
                           onchange="toggleColumn('${col.key}')">
                    <label for="col-${col.key}">${col.label}</label>
                </div>
            `).join('');
        }

        function toggleColumn(key) {
            if (selectedColumns.includes(key)) {
                selectedColumns = selectedColumns.filter(c => c !== key);
            } else {
                selectedColumns.push(key);
            }
            renderReportTable();
        }

        function renderReportTable() {
            const thead = document.getElementById('reportTableHead');
            const tbody = document.getElementById('reportTableBody');

            // Headers
            thead.innerHTML = '<tr>' + 
                selectedColumns.map(key => {
                    const col = availableColumns.find(c => c.key === key);
                    return `<th>${col ? col.label : key}</th>`;
                }).join('') + 
                '</tr>';

            // Rows
            if (allCampaignEvents.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${selectedColumns.length}" style="text-align: center; padding: 40px; color: var(--tv-gray-medium);">Nenhum evento encontrado</td></tr>`;
                return;
            }

            tbody.innerHTML = allCampaignEvents.map(event => {
                return '<tr>' + selectedColumns.map(key => {
                    let value = event[key];
                    if (key === 'created_at') {
                        value = new Date(value).toLocaleString('pt-BR');
                    } else if (key === 'pdf_downloaded' || key === 'lead_created') {
                        value = value ? '<span class="badge badge-yes">Sim</span>' : '<span class="badge badge-no">Não</span>';
                    } else if (!value) {
                        value = '-';
                    }
                    return `<td>${value}</td>`;
                }).join('') + '</tr>';
            }).join('');
        }

        function toggleReportSection() {
            const section = document.getElementById('reportSection');
            section.style.display = section.style.display === 'none' ? 'block' : 'none';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Fechar modal ao clicar fora
        document.getElementById('campaignModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeCampaignModal();
            }
        });

        // Inicializar
        document.addEventListener('DOMContentLoaded', loadCampaigns);
    </script>
</body>
</html>
